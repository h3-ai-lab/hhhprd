<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dino CRM Lark咨询会议与用户详情回写">
  <title>Dino CRM · Lark咨询会议</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --blue: #2368d8;
      --blue-soft: #eaf2ff;
      --navy: #10233f;
      --ink: #1d2939;
      --muted: #667085;
      --line: #e4e9f1;
      --bg: #f3f6fa;
      --white: #fff;
      --green: #16865b;
      --green-soft: #e9f8f1;
      --amber: #a86508;
      --amber-soft: #fff6df;
      --red: #c33a3a;
      --red-soft: #fff0f0;
      --violet: #6e56b5;
      --violet-soft: #f1edff;
      --shadow: 0 12px 32px rgba(29, 50, 78, .1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .sidebar {
      background: var(--navy);
      color: #dce7f7;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: #3577e4; color: white; font-size: 18px; font-weight: 800;
    }
    .brand strong { display: block; color: #fff; font-size: 16px; }
    .brand span { font-size: 11px; color: #9fb2cd; }
    .nav-label { padding: 0 10px; margin-bottom: 6px; color: #8196b4; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .nav-btn {
      width: 100%; border: 0; background: transparent; color: #dce7f7; text-align: left;
      padding: 10px 12px; border-radius: 9px; display: flex; align-items: center; gap: 10px; margin-bottom: 5px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.07); }
    .nav-btn.active { background: #2d70df; color: #fff; }
    .nav-icon { width: 18px; text-align: center; }
    .sidebar-foot { margin-top: auto; padding: 12px; color: #9fb2cd; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #54d49a; display: inline-block; margin-right: 7px; }
    .workspace { min-width: 0; }
    .topbar {
      min-height: 78px; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .crumb { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .title { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .lang-switch { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .lang-btn { border: 0; background: #fff; color: var(--muted); padding: 6px 10px; }
    .lang-btn.active { background: var(--blue); color: #fff; }
    .account { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #eaf2ff; color: var(--blue); font-weight: 800; }
    .account strong { display: block; font-size: 13px; }
    .account span { display: block; color: var(--muted); font-size: 11px; }
    .content { padding: 18px 22px 40px; }
    .toolbar, .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 3px rgba(23, 43, 77, .03); }
    .toolbar { padding: 14px 16px; margin-bottom: 14px; }
    .filters { display: grid; grid-template-columns: minmax(220px, 1.5fr) minmax(150px, .7fr) minmax(150px, .7fr) auto; gap: 10px; align-items: end; }
    .field-label { display: block; margin-bottom: 5px; color: #475467; font-size: 12px; font-weight: 600; }
    .input, .select {
      width: 100%; border: 1px solid #d9e0ea; background: #fff; color: var(--ink);
      border-radius: 7px; padding: 8px 10px; min-height: 36px; outline: none;
    }
    .input:focus, .select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(35,104,216,.12); }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid transparent; border-radius: 7px; min-height: 34px; padding: 6px 12px;
      color: var(--ink); background: #fff; white-space: nowrap;
    }
    .btn:hover { border-color: #bac7d8; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 650; }
    .btn-primary:hover { background: #195dc5; }
    .btn-soft { background: var(--blue-soft); border-color: #dbe8ff; color: var(--blue); font-weight: 650; }
    .btn-danger { background: var(--red-soft); border-color: #ffdada; color: var(--red); }
    .btn-small { min-height: 29px; padding: 4px 9px; font-size: 12px; }
    .panel-head { padding: 15px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .panel-title { font-weight: 750; font-size: 15px; }
    .muted { color: var(--muted); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { background: #f8fafc; text-align: left; color: #475467; font-size: 12px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 12px; border-bottom: 1px solid #edf1f6; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .user-link { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 700; text-align: left; }
    .user-link:hover { text-decoration: underline; }
    .uid { color: #667085; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; width: fit-content; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; }
    .pill-blue { color: var(--blue); background: var(--blue-soft); }
    .pill-green { color: var(--green); background: var(--green-soft); }
    .pill-amber { color: var(--amber); background: var(--amber-soft); }
    .pill-red { color: var(--red); background: var(--red-soft); }
    .pill-violet { color: var(--violet); background: var(--violet-soft); }
    .empty { text-align: center; padding: 52px 20px; color: var(--muted); }
    .notice {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 11px 13px;
      border: 1px solid #cfe0ff; background: #f5f9ff; color: #345274; border-radius: 10px;
    }
    .notice b { color: #183c6d; }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .7fr); gap: 14px; }
    .profile { padding: 18px; }
    .profile-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .profile h2 { margin: 0 0 4px; font-size: 20px; }
    .kv { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px 20px; margin-top: 20px; }
    .kv small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .kv strong { font-weight: 600; font-size: 13px; }
    .meeting-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; background: #fff; }
    .meeting-card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .meeting-card h3 { margin: 0 0 4px; font-size: 15px; }
    .meeting-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .note-preview {
      margin-top: 12px; padding: 12px 13px; border-left: 3px solid #a5bbdc;
      background: #f8fafd; color: #3d4d61; border-radius: 0 8px 8px 0;
      max-height: 160px; overflow: auto; white-space: pre-wrap;
    }
    .section-gap { margin-top: 14px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .section-title h2 { margin: 0; font-size: 16px; }
    .modal-layer {
      position: fixed; inset: 0; background: rgba(15, 27, 46, .46); display: none;
      align-items: center; justify-content: center; padding: 24px; z-index: 50;
    }
    .modal-layer.open { display: flex; }
    .modal {
      width: min(650px, 100%); max-height: min(780px, 92vh); overflow: auto; background: #fff;
      border-radius: 15px; box-shadow: 0 28px 80px rgba(4, 20, 43, .28);
    }
    .modal-head { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .icon-btn { border: 0; background: transparent; color: #667085; font-size: 24px; line-height: 1; }
    .modal-body { padding: 18px 19px; }
    .modal-foot { padding: 14px 19px 18px; display: flex; justify-content: flex-end; gap: 9px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field.full { grid-column: 1 / -1; }
    .error { margin-top: 4px; color: var(--red); font-size: 12px; min-height: 16px; }
    .success-box { border: 1px solid #bee8d4; background: var(--green-soft); padding: 14px; border-radius: 10px; margin-top: 14px; }
    .link-box { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .link-box input { flex: 1; min-width: 0; background: #fff; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px);
      background: #15273f; color: #fff; padding: 9px 14px; border-radius: 8px;
      opacity: 0; pointer-events: none; transition: .2s ease; z-index: 100; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .back-btn { margin-bottom: 12px; }
    .tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 12px 10px 10px; color: #667085; }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
    .profile-side { padding: 16px; }
    .side-list { display: grid; gap: 10px; }
    .side-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .side-item small { display: block; color: var(--muted); margin-bottom: 3px; }
    .detail-page { display: grid; gap: 16px; }
    .detail-page-head { min-height: 64px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .detail-page-title { display: flex; align-items: center; gap: 10px; }
    .detail-page-title::before { content: ""; width: 4px; height: 20px; border-radius: 3px; background: #1677ff; }
    .detail-page-title h2 { margin: 0; font-size: 17px; }
    .info-panel, .meeting-panel { padding: 0; overflow: hidden; }
    .detail-section-head { padding: 18px 18px 12px; }
    .detail-section-head h2 { margin: 0; font-size: 16px; }
    .detail-section-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .info-table { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
    .info-cell { min-width: 0; min-height: 54px; display: grid; grid-template-columns: 160px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    .info-cell:nth-child(odd) { border-right: 1px solid var(--line); }
    .info-cell .info-label { padding: 14px 17px; color: #566476; background: #fbfcff; border-right: 1px solid var(--line); }
    .info-cell .info-value { padding: 14px 17px; color: #283548; overflow-wrap: anywhere; }
    .info-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .meeting-toolbar { padding: 0 18px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .meeting-toolbar span { color: var(--muted); font-size: 12px; }
    .meeting-table-wrap { border-top: 1px solid var(--line); overflow-x: auto; }
    .meeting-table { min-width: 1040px; }
    .meeting-table th, .meeting-table td { white-space: nowrap; }
    .meeting-table .subject { color: var(--ink); font-weight: 650; }
    .meeting-table .meeting-actions { display: flex; gap: 6px; }
    .meeting-table .attendance-time { color: #344054; font-weight: 650; }
    .meeting-rule { padding: 9px 0 0; color: var(--muted); font-size: 11px; }
    .hidden { display: none !important; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { padding: 18px 10px; }
      .brand-copy, .nav-label, .sidebar-foot, .nav-btn span:last-child { display: none; }
      .brand { justify-content: center; padding: 0; }
      .nav-btn { justify-content: center; }
      .detail-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .content { padding: 12px; }
      .topbar { padding: 12px 14px; }
      .account-copy { display: none; }
      .filters { grid-template-columns: 1fr; }
      .form-grid, .kv { grid-template-columns: 1fr; }
      .detail-page-head { align-items: flex-start; flex-direction: column; }
      .info-table { grid-template-columns: 1fr; }
      .info-cell:nth-child(odd) { border-right: 0; }
      .field.full { grid-column: auto; }
      .panel-head, .profile-top { align-items: flex-start; flex-direction: column; }
      .modal-layer { padding: 10px; }
    }
  </style>
</head>

    }

    function bindMeetingActions() {
      document.querySelectorAll("[data-open-meeting]").forEach((btn) => btn.addEventListener("click", () => openMeeting(btn.dataset.openMeeting)));
      document.querySelectorAll("[data-copy-link]").forEach((btn) => btn.addEventListener("click", () => copyMeetingLink(btn.dataset.copyLink)));
      document.querySelectorAll("[data-note]").forEach((btn) => btn.addEventListener("click", () => openNote(btn.dataset.note)));
      document.querySelectorAll("[data-resync]").forEach((btn) => btn.addEventListener("click", () => resyncMeeting(btn.dataset.resync)));
    }

    function openOverlay(html) {
      $("#modal").innerHTML = html;
      $("#modal-layer").classList.add("open");
      $("#modal-layer").setAttribute("aria-hidden", "false");
      $("#modal-layer .icon-btn")?.focus();
    }

    function closeOverlay() {
      $("#modal-layer").classList.remove("open");
      $("#modal-layer").setAttribute("aria-hidden", "true");
      $("#modal").innerHTML = "";
    }

    function openCreate(userId) {
      const user = userById(userId);
      if (!user || user.stage !== "booked") return;
      if (pendingMeeting(user.id)) { openMeeting(pendingMeeting(user.id).id); return; }
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(tr("createTitle"))}</h2><button class="icon-btn" data-close aria-label="${esc(tr("close"))}">×</button></div>
        <form id="create-form">
          <div class="modal-body">
            <div class="form-grid">
              <label class="field full"><span class="field-label">${esc(tr("customer"))}</span><input class="input" value="${esc(user.name)} · ${esc(user.id)}" disabled></label>
              <label class="field full"><span class="field-label">${esc(tr("meetingTitle"))}</span><input class="input" id="meeting-title" value="Consultation - ${esc(user.name)}" required><div class="error" id="title-error"></div></label>
              <label class="field"><span class="field-label">${esc(tr("startTime"))}</span><input class="input" type="datetime-local" id="meeting-start" value="2026-11-20T14:00" required><div class="error" id="time-error"></div></label>
              <label class="field"><span class="field-label">${esc(tr("duration"))}</span><select class="select" id="meeting-duration"><option value="15">15 ${state.lang === "zh" ? "分钟" : "minutes"}</option><option value="30" selected>30 ${state.lang === "zh" ? "分钟" : "minutes"}</option><option value="45">45 ${state.lang === "zh" ? "分钟" : "minutes"}</option><option value="60">60 ${state.lang === "zh" ? "分钟" : "minutes"}</option></select></label>
              <label class="field full"><span class="field-label">${esc(tr("ownerField"))}</span><input class="input" value="${esc(user.owner)}" disabled></label>
            </div>
            <div class="notice section-gap"><span>ⓘ</span><div>${esc(tr("copyAfterCreate"))}</div></div>
            <div id="create-success"></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close>${esc(tr("cancel"))}</button><button type="submit" class="btn btn-primary" id="create-submit">${esc(tr("createCopy"))}</button></div>
        </form>`);
      bindOverlayClose();
      $("#create-form").addEventListener("submit", (event) => { event.preventDefault(); createMeeting(user); });
    }

    async function createMeeting(user) {
      const title = $("#meeting-title").value.trim();
      const start = $("#meeting-start").value;
      const duration = $("#meeting-duration").value;
      $("#title-error").textContent = title ? "" : tr("required");
      $("#time-error").textContent = start ? "" : tr("required");
      if (!title || !start) return;
      const [date, time] = start.split("T");
      const endDate = new Date(`${start}:00`);
      endDate.setMinutes(endDate.getMinutes() + Number(duration));
      const pad = (n) => String(n).padStart(2, "0");
      const end = `${endDate.getFullYear()}-${pad(endDate.getMonth() + 1)}-${pad(endDate.getDate())} ${pad(endDate.getHours())}:${pad(endDate.getMinutes())}`;
      const suffix = String(Date.now()).slice(-9);
      const meeting = {
        id: `m-${Date.now()}`, userId: user.id, eventId: `evt_${suffix.slice(-8)}`,
        meetingId: `73211884119${suffix}`, meetingNo: suffix.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3"),
        url: `https://qjphu5vphyf4.jp.larksuite.com/j/${suffix}`, title, start: `${date} ${time}`,
        end, actualStart: null, actualEnd: null, attendanceMinutes: null, owner: user.owner, status: "scheduled",
        noteStatus: "none", noteId: null, noteBody: null, lastSync: "2026-11-19 16:42"
      };
      meetings.unshift(meeting);
      const copied = await copyText(meeting.url);
      $("#create-submit").classList.add("hidden");
      $("#create-success").innerHTML = `
        <div class="success-box">
          <strong>${esc(copied ? tr("meetingCreated") : tr("copyFailed"))}</strong>
          <div class="link-box"><input class="input" readonly value="${esc(meeting.url)}"><button class="btn btn-soft btn-small" id="copy-again">${esc(tr("copyAgain"))}</button></div>
          <div class="meeting-meta"><span>${esc(tr("createdEvent"))}: ${esc(meeting.eventId)}</span><span>${esc(tr("meetingNo"))}: ${esc(meeting.meetingNo)}</span></div>
          <div class="actions section-gap"><button class="btn btn-primary" id="done-create">${esc(tr("close"))}</button><button class="btn" id="open-lark">${esc(tr("openLark"))}</button></div>
        </div>`;
      $("#copy-again").addEventListener("click", async () => { await copyText(meeting.url); toast(tr("copied")); });
      $("#done-create").addEventListener("click", () => { closeOverlay(); render(); });
      $("#open-lark").addEventListener("click", () => window.open(meeting.url, "_blank", "noopener"));
      toast(copied ? tr("meetingCreated") : tr("copyFailed"));
    }

    function openMeeting(id) {
      const meeting = meetings.find((item) => item.id === id);
      if (!meeting) return;
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(meeting.title)}</h2><button class="icon-btn" data-close>×</button></div>
        <div class="modal-body">
          <div class="actions">${meetingPill(meeting.status)}<span class="pill ${meeting.noteStatus === "saved" ? "pill-green" : meeting.noteStatus === "failed" ? "pill-red" : "pill-amber"}">${esc(meeting.noteStatus === "saved" ? tr("noteSaved") : meeting.noteStatus === "failed" ? tr("noteFailed") : tr("notePending"))}</span></div>
          <div class="kv">
            <div><small>${esc(tr("ownerField"))}</small><strong>${esc(meeting.owner)}</strong></div>
            <div><small>${esc(tr("meetingNo"))}</small><strong>${esc(meeting.meetingNo)}</strong></div>
            <div><small>${esc(tr("meetingTime"))}</small><strong>${esc(meeting.start)} – ${esc(meeting.end)}</strong></div>
            <div><small>${esc(tr("actualTime"))}</small><strong>${meeting.actualStart ? `${esc(meeting.actualStart)} – ${esc(meeting.actualEnd)}` : "—"}</strong></div>
            <div><small>${esc(tr("attendance"))}</small><strong>${esc(MEETING_META[meeting.status]?.[state.lang] || meeting.status)}</strong></div>
            <div><small>${esc(tr("customerAttendance"))}</small><strong>${esc(attendanceText(meeting))}</strong></div>
            <div><small>${esc(tr("lastSync"))}</small><strong>${esc(meeting.lastSync || "—")}</strong></div>
          </div>
          <div class="field section-gap"><span class="field-label">${esc(tr("meetingLink"))}</span><input class="input" readonly value="${esc(meeting.url)}"></div>
          ${meeting.noteStatus === "saved" ? `<div class="note-preview"><strong>${esc(tr("note"))}</strong><br>${esc(tr(meeting.noteBodyKey))}</div>` : ""}
          <div class="actions section-gap">
            <button class="btn btn-soft" data-copy-link="${meeting.id}">${esc(tr("copyLink"))}</button>
            <button class="btn" id="modal-open-lark">${esc(tr("openLark"))}</button>
            ${meeting.noteStatus === "saved" ? `<button class="btn" data-note="${meeting.id}">${esc(tr("viewNote"))}</button>` : ""}
          </div>
        </div>
        <div class="modal-foot"><button class="btn btn-primary" data-close>${esc(tr("close"))}</button></div>`);
      bindOverlayClose();
      bindMeetingActions();
      $("#modal-open-lark").addEventListener("click", () => window.open(meeting.url, "_blank", "noopener"));
    }

    function openNote(id) {
      const meeting = meetings.find((item) => item.id === id);
      if (!meeting || meeting.noteStatus !== "saved") return;
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(tr("note"))}</h2><button class="icon-btn" data-close>×</button></div>
        <div class="modal-body">
          <div class="muted">${esc(tr("sourceLark"))} · ${esc(tr("noteSourceId"))}: ${esc(meeting.noteId)}</div>
          <div class="note-preview" style="max-height:none;margin-top:14px">${esc(tr(meeting.noteBodyKey))}</div>
        </div>
        <div class="modal-foot"><button class="btn btn-primary" data-close>${esc(tr("close"))}</button></div>`);
      bindOverlayClose();
    }

    function resyncMeeting(id) {
      const meeting = meetings.find((item) => item.id === id);
      if (!meeting) return;
      meeting.status = meeting.status === "sync_failed" ? "ended_pending" : meeting.status;
      if (meeting.noteStatus === "failed") meeting.noteStatus = "none";
      meeting.lastSync = "2026-11-19 16:46";
      closeOverlay();
      render();
      toast(tr("synced"));
    }

    function bindOverlayClose() {
      document.querySelectorAll("[data-close]").forEach((btn) => btn.addEventListener("click", closeOverlay));
    }

    async function copyMeetingLink(id) {
      const meeting = meetings.find((item) => item.id === id);
      if (!meeting) return;
      const ok = await copyText(meeting.url);
      toast(ok ? tr("meetingLink") + " ✓" : tr("copyFailed"));
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        const ok = document.execCommand("copy");
        temp.remove();
        return ok;
      }
    }

    let toastTimer;
    function toast(message) {
      const node = $("#toast");
      node.textContent = message;
      node.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove("show"), 2200);
    }

    document.querySelectorAll(".nav-btn").forEach((btn) => btn.addEventListener("click", () => setRoute(btn.dataset.route)));
    document.querySelectorAll(".lang-btn").forEach((btn) => btn.addEventListener("click", () => updateLanguage(btn.dataset.lang)));
    $("#modal-layer").addEventListener("click", (event) => { if (event.target.id === "modal-layer") closeOverlay(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeOverlay(); });

    updateLanguage(state.lang);
  </script>
</body>
</html>
