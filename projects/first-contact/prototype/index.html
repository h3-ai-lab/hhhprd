<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dino CRM 首位联系人工作台">
  <title>Dino CRM · 首位联系人</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M8 4 5 6c0 7 6 13 13 13l2-3-4-2-2 2c-2-1-4-3-5-5l2-2z"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">D</div>
        <div class="brand-copy">
          <strong>Dino CRM</strong>
          <span>销售中心 · 全业务线</span>
        </div>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <div class="nav-group-label">销售中心</div>
        <button class="nav-item is-active" data-route="leads">
          <svg><use href="#i-list"></use></svg><span>线索与筛选</span>
        </button>
        <button class="nav-item" data-route="monitor">
          <svg><use href="#i-pulse"></use></svg><span>团队监控</span>
        </button>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menu-toggle" aria-label="展开导航">
            <svg><use href="#i-menu"></use></svg>
          </button>
          <div>
            <div class="crumb">Dino CRM <span>/</span> 销售管理 <span>/</span> 销售中心</div>
            <h1 id="page-title">我的跟进 · 首位联系人</h1>
          </div>
        </div>
        <div class="topbar-right">
          <span class="env-tag"><i></i> 全业务线</span>
          <button class="btn btn-secondary btn-small" data-route="monitor">团队监控</button>
          <div class="account">
            <div class="avatar">S</div>
            <div><strong>销售运营组长</strong><span>销售中心</span></div>
          </div>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-layer" id="drawer-layer" aria-hidden="true">
    <button class="drawer-scrim" data-action="close-drawer" aria-label="关闭详情"></button>
    <aside class="drawer" id="drawer" aria-label="线索详情"></aside>
  </div>

  <div class="modal-layer" id="export-layer" aria-hidden="true">
    <button class="modal-scrim" data-action="close-export" aria-label="关闭下载预览"></button>
    <section class="modal" id="export-modal" role="dialog" aria-modal="true" aria-labelledby="export-title"></section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script defer src="./app.js"></script>
</body>
</html>
