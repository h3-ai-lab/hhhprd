    const state={lang:localStorage.getItem("learn-lang")||"zh",page:"users",salesTab:"mine",dashTab:"learning",detailUser:null,
      userFilters:{q:"",line:"",plan:"",activity:"",expiry:"",level:""},
      salesFilters:{q:"",line:"",cc:"",intent:"",stage:"",plan:"",activity:"",expiry:"",level:""},
      dashFilters:{line:"",cc:"",plan:"",level:""}};
    const t=(key,vars={})=>{let v=T[state.lang][key]??key;Object.entries(vars).forEach(([k,x])=>v=String(v).replaceAll(`{${k}}`,String(x)));return v;};
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const option=(v,l,s)=>`<option value="${esc(v)}" ${v===s?"selected":""}>${esc(l)}</option>`;
    const fmt=p=>p?p.replace(/\s\(\+\d{2}\)$/,""):"—";
    const activityLabel=v=>({not_started:t("notStarted"),in_class:t("inClass"),active:t("active"),inactive7:t("inactive7"),expired:t("expired"),none:t("noPlan")}[v]||v);
    const planStatusLabel=v=>({active:t("activePlan"),expired:t("expiredPlan"),none:t("noPlan"),not_started:t("notStartedPlan"),cancelled:t("cancelledPlan")}[v]||v);
    const planLabel=v=>v||t("emptyPlan");
    const progressLabel=u=>u.level==="—"?t("notStarted"):`${u.level} · U${u.unit} · L${u.lesson}`;
    const activityTag=v=>`<span class="tag ${v==="in_class"?"green":v==="active"?"blue":v==="inactive7"?"amber":v==="expired"?"red":"gray"}">${activityLabel(v)}</span>`;
    const remainingDays=u=>{if(!u.planEnd)return null;const end=new Date(`${u.planEnd}T23:59:59+08:00`);const now=new Date("2026-11-17T23:59:59+08:00");return Math.max(0,Math.ceil((end-now)/86400000));};
    const matchExpiry=(u,value)=>{const days=remainingDays(u);if(!value)return true;if(value==="expired")return u.planStatus==="expired";if(days===null)return false;if(value==="7")return days<=7;if(value==="30")return days<=30;return true;};
    const matches=(u,f)=>(!f.line||u.line===f.line)&&(!f.plan||u.plan===f.plan)&&(!f.planStatus||u.planStatus===f.planStatus)&&(!f.activity||u.activity===f.activity)&&(!f.level||u.level===f.level)&&matchExpiry(u,f.expiry);
    const filteredUsers=()=>LEARNERS.filter(u=>{const f=state.userFilters,q=f.q.toLowerCase().trim();return(!q||`${u.userId} ${u.name}`.toLowerCase().includes(q))&&matches(u,f);});
    const filteredSales=()=>LEARNERS.filter(u=>{const f=state.salesFilters,q=f.q.toLowerCase().trim();return u.bucket===state.salesTab&&(!q||`${u.userId} ${u.name}`.toLowerCase().includes(q))&&(!f.cc||u.cc===f.cc)&&(!f.intent||u.intent===f.intent)&&(!f.stage||u.stage===f.stage)&&matches(u,f);});
    const filteredDashboard=()=>LEARNERS.filter(u=>{const f=state.dashFilters;return(!f.line||u.line===f.line)&&(!f.cc||u.cc===f.cc)&&(!f.plan||u.plan===f.plan)&&(!f.level||u.level===f.level);});
    const filterSelect=(kind,key,name,values,selected,allLabel)=>`<div class="field"><label>${name}</label><select class="control" data-filter-kind="${kind}" data-filter-key="${key}">${option("",allLabel,selected)}${values.map(v=>Array.isArray(v)?option(v[0],v[1],selected):option(v,v,selected)).join("")}</select></div>`;
    function customerFilters(kind){const f=state[kind];return `<div class="filterRow"><div class="field search"><label>${kind==="userFilters"?t("searchUser"):t("searchLead")}</label><input class="control" id="${kind}-q" data-filter-kind="${kind}" data-filter-key="q" value="${esc(f.q)}"></div>
      ${filterSelect(kind,"line",t("line"),["VN","MY","TH"],f.line,t("all"))}
      ${kind==="salesFilters"?filterSelect(kind,"cc",t("cc"),["Nguyễn Anh","Mali Tan","Porn K."],f.cc,t("allCc")):""}</div>
      <div class="filterRow">${filterSelect(kind,"plan",t("plan"),[["Pro","Pro"],["Max","Max"]],f.plan,t("allPlans"))}
      ${filterSelect(kind,"activity",t("learningStatus"),[["not_started",t("notStarted")],["in_class",t("inClass")],["active",t("active")],["inactive7",t("inactive7")],["expired",t("expired")],["none",t("noPlan")]],f.activity,t("allStatus"))}
      ${filterSelect(kind,"expiry",t("expiry"),[["7",t("expiry7")],["30",t("expiry30")],["expired",t("alreadyExpired")]],f.expiry,t("allExpiry"))}
      ${filterSelect(kind,"level",t("level"),["L1","L2","L3","L4","L5","L6","—"],f.level,t("allLevel"))}</div>`;}
    function renderUsers(){const rows=filteredUsers();return `<div class="pageHead"><div><h1>${t("userList")}</h1><p class="sub">${t("userSub")}</p></div></div>
      <section class="panel filterPanel">${customerFilters("userFilters")}<div class="filterRow"><div class="actionRow"><button class="button ghost" data-action="reset-user">${t("reset")}</button><button class="button primary" data-action="export-user">${t("export")}</button></div></div></section>
      <section class="panel"><div class="sectionTitle"><h2>${t("userList")}</h2><span class="pill">${rows.length} ${t("people")}</span></div>${rows.length?learnerTable(rows):emptyState()}</section>`;}
    function renderSales(){const rows=filteredSales();return `<div class="pageHead"><div><h1>${t("salesList")}</h1><p class="sub">${t("salesSub")}</p></div></div>
      <section class="panel"><div class="tabs">${[["pool",t("pool")],["mine",t("mine")],["paid",t("paid")]].map(([k,l])=>`<button class="tab ${state.salesTab===k?"active":""}" data-sales-tab="${k}">${l}</button>`).join("")}</div><div class="filterPanel">${customerFilters("salesFilters")}<div class="filterRow"><div class="actionRow"><button class="button ghost" data-action="reset-sales">${t("reset")}</button><button class="button primary" data-action="export-sales">${t("download")}</button></div></div></div></section>
      <section class="panel"><div class="sectionTitle"><h2>${t("salesList")}</h2><span class="pill">${rows.length} ${t("people")}</span></div>${rows.length?learnerTable(rows):emptyState()}</section>`;}
    function learnerTable(rows){return `<div class="tableWrap"><table class="table"><thead><tr><th>${t("userId")}</th><th>${t("name")}</th><th>${t("plan")}</th><th>${t("currentProgress")}</th><th>${t("weekProgress")}</th><th>${t("lastLearning")}</th><th>${t("learningStatus")}</th><th>${t("expiry")}</th><th>${t("actions")}</th></tr></thead><tbody>${rows.map(u=>`<tr><td class="mono">${u.userId}</td><td><strong>${esc(u.name)}</strong><span class="subtext">${u.line} · ${u.cc}</span></td><td>${planLabel(u.plan)}</td><td><span class="progressLine">${progressLabel(u)}</span></td><td>${u.plan?t("weekDone",{done:u.weekDone,quota:u.quota}):"—"}<span class="subtext">${u.plan?`${t("remainingWeek")} ${Math.max(0,u.quota-u.weekDone)}`: ""}</span></td><td>${fmt(u.lastLearning)}</td><td>${activityTag(u.activity)}</td><td>${u.planEnd?`${u.planEnd}<span class="subtext">${remainingDays(u)} ${t("days",{count:remainingDays(u)})}</span>`:"—"}</td><td><button class="button" data-user="${u.userId}">${t("view")}</button></td></tr>`).join("")}</tbody></table></div>`;}
    const metricDefs={
      activeUsers:{zh:"当前学习计划状态为生效中的用户数，按用户 ID 去重。",en:"Users with an active learning plan, deduplicated by User ID."},
      inClassUsers:{zh:"课程系统当前明确返回正在上课的用户数，按用户 ID 去重。",en:"Users currently reported as in class by the learning system, deduplicated by User ID."},
      activeLearners:{zh:"生效学习计划用户中，近 7 个业务线自然日内至少有一条有效学习记录的用户数。",en:"Active-plan users with at least one effective learning event in the last 7 business-line days."},
      inactiveLearners:{zh:"学习计划生效已满 7 天，且近 7 个业务线自然日没有有效学习记录的用户数。",en:"Users whose plan has been active at least 7 days with no effective learning event in the last 7 business-line days."},
      weekLessons:{zh:"当前业务线学习周内完成状态为完成的正式 Lesson 数，按 Lesson ID 去重。",en:"Completed formal Lessons in the current business-line learning week, deduplicated by Lesson ID."},
      expiringUsers:{zh:"当前生效学习计划将在 0–7 个业务线自然日内到期的用户数。",en:"Active-plan users expiring within 0–7 business-line calendar days."},
      activityRate:{zh:"近 7 天活跃学习者数 ÷（近 7 天活跃学习者数 + 近 7 天零学习用户数）。",en:"Active learners in 7d ÷ (active learners in 7d + zero-learning users in 7d)."}
    };
    const metrics={activeUsers:rows=>rows.filter(u=>u.planStatus==="active").length,inClassUsers:rows=>rows.filter(u=>u.inClass).length,activeLearners:rows=>rows.filter(u=>u.planStatus==="active"&&u.learningDays7>0).length,inactiveLearners:rows=>rows.filter(u=>u.planStatus==="active"&&u.learningDays7===0&&new Date("2026-11-17T23:59:59+08:00")-new Date(`${u.planStart}T00:00:00+08:00`)>=7*86400000).length,weekLessons:rows=>rows.filter(u=>u.planStatus==="active").reduce((s,u)=>s+u.weekDone,0),expiringUsers:rows=>rows.filter(u=>u.planStatus==="active"&&remainingDays(u)<=7).length};
    function dashboardContent(rows){const stat={};Object.keys(metrics).forEach(k=>stat[k]=metrics[k](rows));const denom=stat.activeLearners+stat.inactiveLearners;stat.activityRate=denom?(stat.activeLearners/denom*100).toFixed(1):"—";const keys=["activeUsers","inClassUsers","activeLearners","inactiveLearners","weekLessons","expiringUsers","activityRate"];return `<div class="metrics">${keys.map(k=>`<article class="metric"><button class="help" data-metric="${k}">i</button><div class="metricName">${metricName(k)}</div><div class="metricValue">${stat[k]==="—"?"—":stat[k]}${k==="activityRate"&&stat[k]!=="—"?"%":""}</div><div class="metricMeta">${k==="weekLessons"?t("lessons"):k==="activityRate"&&denom?`${stat.activeLearners} / ${denom}`:t("people")}</div></article>`).join("")}</div>
      <div class="dashboardBody">${detailTable(rows)}</div>`;}
    function metricName(k){return({activeUsers:t("activeUsers"),inClassUsers:t("inClassUsers"),activeLearners:t("activeLearners"),inactiveLearners:t("inactiveLearners"),weekLessons:t("weekLessons"),expiringUsers:t("expiringUsers"),activityRate:t("activityRate")})[k]||k;}
    function detailTable(rows){const groups=new Map();rows.forEach(u=>{const key=`${u.line}|${u.plan||"—"}|${u.level||"—"}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(u);});const metricKeys=["activeUsers","inClassUsers","activeLearners","inactiveLearners","weekLessons","expiringUsers"];return `<div class="dashboardHeading"><h2>${t("learningTab")}</h2><span class="pill">${rows.length} ${t("people")}</span><span class="sub">${t("dataTime")}</span></div><div class="tableWrap"><table class="table metricTable"><thead><tr><th>${t("groupLine")}</th><th>${t("groupPlan")}</th><th>${t("groupLevel")}</th>${metricKeys.map(k=>`<th>${metricName(k)} <button class="help" data-metric="${k}" style="position:relative;top:auto;right:auto;vertical-align:middle">i</button></th>`).join("")}<th>${t("activityRate")} <button class="help" data-metric="activityRate" style="position:relative;top:auto;right:auto;vertical-align:middle">i</button></th></tr></thead><tbody>${[...groups.entries()].map(([key,g])=>{const [line,plan,level]=key.split("|");const s={};Object.keys(metrics).forEach(k=>s[k]=metrics[k](g));const d=s.activeLearners+s.inactiveLearners;return `<tr><td>${line}</td><td>${plan}</td><td>${level}</td><td>${s.activeUsers}</td><td>${s.inClassUsers}</td><td>${s.activeLearners}</td><td>${s.inactiveLearners}</td><td>${s.weekLessons}</td><td>${s.expiringUsers}</td><td class="rate">${d?(s.activeLearners/d*100).toFixed(1)+"%":"—"}<small>${s.activeLearners} / ${d}</small></td></tr>`}).join("")}</tbody></table></div>`;}
    function renderDashboard(){const rows=filteredDashboard(), f=state.dashFilters;const tabs=[["overview",t("overview")],["followup",t("followup")],["learning",t("learningTab")],["payment",t("payment")]];let body="";if(state.dashTab==="learning"){body=dashboardContent(rows);}else if(state.dashTab==="overview"){body=`<div class="dashboardBody"><p class="sub">${t("overviewText")}</p><div class="metrics">${[["leads",LEARNERS.length],["outbound",10],["connected",8],["booked",7],["trial",5],["paid",3]].map(([k,v])=>`<article class="metric"><div class="metricName">${t(k)}</div><div class="metricValue">${v}</div></article>`).join("")}</div></div>`;}else if(state.dashTab==="followup"){body=`<div class="dashboardBody"><p class="sub">${t("followupText")}</p></div>`;}else{body=`<div class="dashboardBody"><p class="sub">${t("paymentText")}</p></div>`;}return `<div class="pageHead"><div><h1>${t("dashboard")}</h1><p class="sub">${t("dashSub")}</p></div></div><section class="panel"><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${state.dashTab===k?"active":""}" data-dash-tab="${k}">${l}</button>`).join("")}</div>${state.dashTab==="learning"?`<div class="filterPanel"><div class="filterRow">${filterSelect("dashFilters","line",t("line"),["VN","MY","TH"],f.line,t("all"))}${filterSelect("dashFilters","cc",t("cc"),["Nguyễn Anh","Mali Tan","Porn K."],f.cc,t("allCc"))}${filterSelect("dashFilters","plan",t("plan"),[["Pro","Pro"],["Max","Max"]],f.plan,t("allPlans"))}${filterSelect("dashFilters","level",t("level"),["L1","L2","L3","L4","L5","L6","—"],f.level,t("allLevel"))}</div><div class="filterRow"><div class="actionRow"><button class="button ghost" data-action="reset-dashboard">${t("reset")}</button></div></div></div>`:""}${body}</section>`;}
    function emptyState(){return `<div class="empty"><strong>${t("noData")}</strong><span>${t("noDataSub")}</span></div>`;}
    function openDetail(id){const u=LEARNERS.find(x=>x.userId===id);if(!u)return;state.detailUser=id;const events=EVENTS[id]||[];document.getElementById("drawer").innerHTML=`<div class="drawerHead"><div><span class="pill">${u.userId}</span><h2>${esc(u.name)}</h2><p class="sub">${u.line} · ${u.cc}</p></div><button class="close" data-action="close-detail">×</button></div>
      <div class="detailGrid"><div class="detailCard"><h3>${t("planInfo")}</h3><dl class="factGrid"><dt>${t("planName")}</dt><dd>${planLabel(u.plan)}</dd><dt>${t("planStatus")}</dt><dd>${planStatusLabel(u.planStatus)}</dd><dt>${t("validity")}</dt><dd>${u.planStart||"—"} ${t("to")} ${u.planEnd||"—"}</dd><dt>${t("remainingDays")}</dt><dd>${u.planEnd?remainingDays(u):"—"}</dd></dl></div>
      <div class="detailCard"><h3>${t("currentPosition")}</h3><dl class="factGrid"><dt>${t("level")}</dt><dd>${u.level}</dd><dt>${t("currentLesson")}</dt><dd>${u.unit?`U${u.unit} · L${u.lesson}`:"—"}</dd><dt>${t("levelDone")}</dt><dd>${u.completed} / 144</dd><dt>${t("totalDone")}</dt><dd>${u.level!=="—"?(Number(u.level.slice(1))-1)*144+u.completed:0} / 864</dd></dl></div>
      <div class="detailCard"><h3>${t("weekPlan")}</h3><dl class="factGrid"><dt>${t("weeklyQuota")}</dt><dd>${u.quota||0}</dd><dt>${t("completedWeek")}</dt><dd>${u.weekDone||0}</dd><dt>${t("remainingWeek")}</dt><dd>${u.plan?Math.max(0,u.quota-u.weekDone):0}</dd></dl></div>
      <div class="detailCard"><h3>${t("learningPerf")}</h3><dl class="factGrid"><dt>${t("lastEvent")}</dt><dd>${fmt(u.lastLearning)}</dd><dt>${t("days7")}</dt><dd>${u.learningDays7}</dd><dt>${t("validMinutes")}</dt><dd>${u.minutes} min</dd><dt>${t("learningStatus")}</dt><dd>${activityTag(u.activity)}</dd></dl></div></div>
      <div class="detailCard"><h3>${t("recent")}</h3><ul class="timeline">${events.length?events.map(e=>`<li><strong>${esc(e.module)} · ${esc(e.content)}</strong><span>${fmt(e.time)} · ${e.minutes} min · ${e.effective?t("effective"):t("play")}</span></li>`).join(""):`<li><span>${t("noData")}</span></li>`}</ul></div>`;
      document.getElementById("drawerLayer").classList.add("open");}
    function closeDetail(){document.getElementById("drawerLayer").classList.remove("open");document.getElementById("drawer").innerHTML="";state.detailUser=null;}
    function openMetric(k){document.getElementById("modal").innerHTML=`<div class="modalHead"><h3>${metricName(k)} · ${t("metricHelp")}</h3><button class="close" data-action="close-modal">×</button></div><div class="modalBody"><div class="formula">${metricDefs[k]?.[state.lang]||""}</div></div>`;document.getElementById("modalLayer").classList.add("open");}
    function closeModal(){document.getElementById("modalLayer").classList.remove("open");}
    function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove("show"),1800);}
    function exportRows(rows){const header=["user_id","name","business_line","learning_plan","plan_status","plan_start","plan_end","current_level","current_unit","current_lesson","weekly_quota","weekly_completed","weekly_remaining","last_learning_at","learning_status","completed_lessons","effective_learning_minutes"];const data=rows.map(u=>[u.userId,u.name,u.line,u.plan||"",u.planStatus,u.planStart||"",u.planEnd||"",u.level,u.unit??"",u.lesson??"",u.quota,u.weekDone,Math.max(0,u.quota-u.weekDone),u.lastLearning||"",u.activity,u.completed,u.minutes]);const csv="\uFEFF"+[header,...data].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="crm-learning-progress.csv";a.click();URL.revokeObjectURL(url);toast("Learning progress exported");}
    function reset(kind){if(kind==="userFilters")state.userFilters={q:"",line:"",plan:"",activity:"",expiry:"",level:""};if(kind==="salesFilters")state.salesFilters={q:"",line:"",cc:"",intent:"",stage:"",plan:"",activity:"",expiry:"",level:""};if(kind==="dashFilters")state.dashFilters={line:"",cc:"",plan:"",level:""};}
    function render(){document.documentElement.lang=state.lang==="zh"?"zh-CN":"en";document.title=`Dino CRM · ${t("app")}`;document.getElementById("navLabel").textContent=t("nav");document.querySelectorAll("[data-label]").forEach(e=>e.textContent=t(e.dataset.label));document.querySelectorAll("[data-lang]").forEach(e=>e.classList.toggle("active",e.dataset.lang===state.lang));document.querySelectorAll(".navItem").forEach(e=>e.classList.toggle("active",e.dataset.page===state.page));document.getElementById("mobileNav").innerHTML=[["users",t("userList")],["sales",t("salesList")],["dashboard",t("dashboard")]].map(([k,l])=>`<button class="${state.page===k?"active":""}" data-page="${k}">${l}</button>`).join("");document.getElementById("crumbCurrent").textContent=t(state.page==="users"?"userList":state.page==="sales"?"salesList":"dashboard");document.getElementById("content").innerHTML=state.page==="users"?renderUsers():state.page==="sales"?renderSales():renderDashboard();}
    function setFilter(kind,key,value){state[kind][key]=value;render();const e=document.getElementById(`${kind}-${key}`);if(e){e.focus();if(e.tagName==="INPUT")e.setSelectionRange(e.value.length,e.value.length);}}
    document.addEventListener("click",e=>{const lang=e.target.closest("[data-lang]");if(lang){state.lang=lang.dataset.lang;localStorage.setItem("learn-lang",state.lang);render();return;}const nav=e.target.closest("[data-page]");if(nav){state.page=nav.dataset.page;render();return;}const st=e.target.closest("[data-sales-tab]");if(st){state.salesTab=st.dataset.salesTab;render();return;}const dt=e.target.closest("[data-dash-tab]");if(dt){state.dashTab=dt.dataset.dashTab;render();return;}const user=e.target.closest("[data-user]");if(user){openDetail(user.dataset.user);return;}const metric=e.target.closest("[data-metric]");if(metric){openMetric(metric.dataset.metric);return;}const action=e.target.closest("[data-action]")?.dataset.action;if(!action)return;if(action==="reset-user"){reset("userFilters");render();}if(action==="reset-sales"){reset("salesFilters");render();}if(action==="reset-dashboard"){reset("dashFilters");render();}if(action==="export-user")exportRows(filteredUsers());if(action==="export-sales")exportRows(filteredSales());if(action==="close-detail")closeDetail();if(action==="close-modal")closeModal();if(e.target.id==="modalLayer")closeModal();});
    document.addEventListener("change",e=>{const f=e.target.closest("[data-filter-kind]");if(f&&f.tagName==="SELECT")setFilter(f.dataset.filterKind,f.dataset.filterKey,f.value);});
    document.addEventListener("input",e=>{const f=e.target.closest("[data-filter-kind]");if(f&&f.tagName==="INPUT")setFilter(f.dataset.filterKind,f.dataset.filterKey,f.value);});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDetail();closeModal();}});
    render();
  </script>
</body>
</html>
