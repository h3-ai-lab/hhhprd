<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino CRM · 销售中心</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --navy: #10233f;
      --blue: #2368d8;
      --blue-soft: #eaf2ff;
      --ink: #1d2939;
      --muted: #667085;
      --line: #e4e9f1;
      --bg: #f3f6fa;
      --white: #fff;
      --green: #16865b;
      --green-soft: #e9f8f1;
      --amber: #a86508;
      --amber-soft: #fff6df;
      --red: #c33a3a;
      --red-soft: #fff0f0;
      --violet: #6e56b5;
      --violet-soft: #f1edff;
      --shadow: 0 18px 50px rgba(16, 35, 63, .18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--bg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(35, 104, 216, .18);
      outline-offset: 1px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 23px;
      padding: 22px 14px;
      color: #dce7f7;
      background: var(--navy);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: #3577e4;
      font-size: 18px;
      font-weight: 800;
    }

    .brand strong { display: block; color: #fff; font-size: 16px; }
    .brand span { display: block; color: #9fb2cd; font-size: 11px; }

    .nav-label {
      margin: 0 10px 7px;
      color: #8196b4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      color: #dce7f7;
      background: transparent;
      text-align: left;
    }

    .nav-btn:hover { background: rgba(255,255,255,.07); }
    .nav-btn.active { color: #fff; background: #2d70df; }
    .nav-icon { width: 18px; text-align: center; }

    .sidebar-foot {
      margin-top: auto;
      padding: 12px;
      color: #9fb2cd;
      font-size: 12px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #54d49a;
    }

    .workspace { min-width: 0; overflow: hidden; }

    .topbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .crumb { margin-bottom: 3px; color: var(--muted); font-size: 12px; }
    .title { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
    .top-actions { display: flex; align-items: center; gap: 14px; }

    .lang-switch {
      display: flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .lang-btn { padding: 6px 10px; border: 0; color: var(--muted); background: #fff; }
    .lang-btn.active { color: #fff; background: var(--blue); }
    .account { display: flex; align-items: center; gap: 9px; }
    .avatar {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: var(--blue-soft);
      font-weight: 800;
    }
    .account strong { display: block; font-size: 13px; }
    .account span { display: block; color: var(--muted); font-size: 11px; }

    .content { padding: 18px 22px 40px; }
    .panel, .toolbar {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(23, 43, 77, .03);
    }

    .primary-tabs {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 0;
      padding: 0 2px;
      border-bottom: 1px solid #dfe3eb;
      background: transparent;
    }

    .primary-tab {
      position: relative;
      min-height: 43px;
      padding: 0 0 12px;
      border: 0;
      color: #5e6979;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
    }

    .primary-tab.active { color: #1f2329; font-weight: 700; }
    .primary-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: #1677ff;
    }

    .primary-tab .tab-count { color: #7d8795; font-weight: 400; }
    .primary-tab.active .tab-count { color: #475467; }

    .toolbar { margin-bottom: 14px; padding: 14px 16px; }
    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) minmax(150px, .7fr) minmax(150px, .7fr) auto;
      gap: 10px;
      align-items: end;
    }

    .field-label { display: block; margin-bottom: 5px; color: #475467; font-size: 12px; font-weight: 600; }
    .input, .select, .textarea {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid #d9e0ea;
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
    }

    .textarea { min-height: 92px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--blue); }
    .actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
      white-space: nowrap;
    }

    .btn:hover { border-color: #bac7d8; }
    .btn-primary { color: #fff; border-color: var(--blue); background: var(--blue); font-weight: 650; }
    .btn-primary:hover { background: #195dc5; }
    .btn-small { min-height: 29px; padding: 4px 9px; font-size: 12px; }
    .btn-ghost { color: var(--blue); border-color: #cee0ff; background: #f6f9ff; }

    .queue-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      border-bottom: 1px solid #e7eaf0;
    }

    .queue-strip {
      display: flex;
      min-width: 0;
      gap: 22px;
      overflow-x: auto;
      padding: 0;
      scrollbar-width: thin;
    }

    .queue-chip {
      position: relative;
      flex: 0 0 auto;
      min-height: 43px;
      padding: 0 0 11px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: #667085;
      background: transparent;
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .queue-chip:hover { color: #255fc4; }
    .queue-chip.active { color: #1666d8; border-bottom-color: #1677ff; font-weight: 700; }
    .queue-chip.all { min-width: 48px; }

    .queue-name { display: inline; }
    .queue-priority { margin-left: 3px; color: #9aa3af; font-size: 9px; font-weight: 500; }
    .queue-count {
      display: inline-flex;
      min-width: 18px;
      min-height: 18px;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      padding: 0 5px;
      border-radius: 999px;
      color: #596678;
      background: #f0f2f5;
      font-size: 10px;
      font-weight: 600;
    }

    .queue-chip.active .queue-count { color: #fff; background: #1677ff; }
    .queue-refresh {
      flex: 0 0 auto;
      padding: 5px 7px;
      border: 0;
      border-radius: 6px;
      color: #7f8997;
      background: transparent;
      font-size: 13px;
    }
    .queue-refresh:hover { color: #245fc7; background: #f2f5fa; }
    .subqueue-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 31px;
      padding: 4px 2px;
      border-bottom: 1px solid #eef1f5;
    }
    .subqueue-label { color: #7d8999; font-size: 11px; }
    .subqueue-btn {
      padding: 4px 9px;
      border: 1px solid #dce3ed;
      border-radius: 999px;
      color: #526071;
      background: #fff;
      font-size: 11px;
    }
    .subqueue-btn.active { border-color: #b8cff8; color: #195cc9; background: #f0f5ff; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { font-size: 15px; font-weight: 750; }
    .muted { color: var(--muted); }
    .table-wrap { overflow: auto; }
    table { width: 100%; min-width: 1020px; border-collapse: collapse; white-space: nowrap; }
    th {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      color: #475467;
      background: #f8fafc;
      font-size: 12px;
      text-align: left;
    }
    td { padding: 12px; border-bottom: 1px solid #edf1f6; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdff; }
    .user-link { padding: 0; border: 0; color: var(--blue); background: none; font-weight: 700; text-align: left; }
    .user-link:hover { text-decoration: underline; }
    .uid { margin-top: 2px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
    }
    .pill-blue { color: var(--blue); background: var(--blue-soft); }
    .pill-green { color: var(--green); background: var(--green-soft); }
    .pill-amber { color: var(--amber); background: var(--amber-soft); }
    .pill-red { color: var(--red); background: var(--red-soft); }
    .pill-violet { color: var(--violet); background: var(--violet-soft); }

    .empty {
      display: grid;
      justify-items: center;
      gap: 9px;
      padding: 58px 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty strong { color: #344054; font-size: 15px; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      padding: 13px 16px;
      border-top: 1px solid var(--line);
    }
    .page-btn {
      min-width: 31px;
      height: 31px;
      border: 1px solid #dce3ed;
      border-radius: 7px;
      color: #536174;
      background: #fff;
    }
    .page-btn.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      justify-content: flex-end;
      background: rgba(11, 25, 47, .38);
    }
    .overlay.open { display: flex; }
    .drawer {
      width: min(530px, 100%);
      height: 100%;
      overflow: auto;
      background: #fff;
      box-shadow: -18px 0 55px rgba(9, 26, 51, .2);
    }
    .drawer-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .drawer-head h2 { margin: 0; font-size: 19px; }
    .drawer-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .icon-btn { padding: 3px 8px; border: 0; color: #6b7280; background: transparent; font-size: 24px; }
    .drawer-body { padding: 20px; }
    .detail-grid { display: grid; grid-template-columns: 140px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .detail-grid dt, .detail-grid dd { margin: 0; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    .detail-grid dt { color: #667085; background: #fafbfd; }
    .detail-grid dd:last-child, .detail-grid dt:nth-last-child(2) { border-bottom: 0; }
    .form-grid { display: grid; gap: 14px; }
    .form-field label { display: block; margin-bottom: 6px; color: #475467; font-size: 12px; font-weight: 650; }
    .error { min-height: 17px; margin-top: 5px; color: var(--red); font-size: 12px; }
    .drawer-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 100;
      padding: 9px 14px;
      border-radius: 8px;
      color: #fff;
      background: #15273f;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { padding: 18px 10px; }
      .brand-copy, .nav-label, .sidebar-foot, .nav-btn span:last-child { display: none; }
      .brand, .nav-btn { justify-content: center; padding-inline: 0; }
    }

    @media (max-width: 720px) {
      .app { grid-template-columns: 60px minmax(0, 1fr); }
      .content { padding: 12px; }
      .topbar { display: block; padding: 12px 14px; }
      .top-actions { width: auto; justify-content: flex-start; margin-top: 10px; }
      .account { display: none; }
      .filters { grid-template-columns: 1fr; }
      .queue-head { align-items: flex-start; flex-direction: column; }
      .queue-strip { width: 100%; gap: 16px; }
      .queue-chip { min-height: 37px; padding-bottom: 8px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .drawer { width: 100%; }
    }
  </style>
</head>

      <div class="brand">
        <div class="brand-mark">D</div>
        <div class="brand-copy">

    <div class="workspace">

      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

    const state = {
      lang: localStorage.getItem("crm-quick-filter-lang") || "zh",
      primaryTab: "myFollowUp",
      queue: "all",

    const $ = (selector, parent = document) => parent.querySelector(selector);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
    const t = (key) => I18N[state.lang][key] ?? key;
    const fmt = (key, vars) => t(key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
    const mainOf = (queue) => QUEUE_META[queue]?.main || queue;
    const intentLabel = (key) => {
      const map = { interested: "intentInterested", neutral: "intentNeutral", notInterested: "intentNotInterested" };
      return t(map[key] || key);
    };
    const stageLabel = (key) => t(STAGE_META[key]?.key || key);
    const lineLabel = (key) => t(BL_META[key] || key);
    const queueMainLabel = (queue) => {
      const main = mainOf(queue);
      if (!queue) return t("processed");
      if (main === "pending") return t("pendingConnect");
      return t(QUEUE_META[main]?.title || main);
    };
    const actionLabel = (queue) => t(QUEUE_META[queue]?.action || "viewUser");
    const showToast = (message) => {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
    };

    function baseRows() {
      const q = state.search.trim().toLowerCase();
      return leads.filter((lead) => {
        const searchOk = !q || lead.name.toLowerCase().includes(q) || lead.id.toLowerCase().includes(q);
        const lineOk = state.line === "all" || lead.line === state.line;
        const stageOk = state.stage === "all" || lead.stage === state.stage;
        return searchOk && lineOk && stageOk;
      });
    }

    function queueMatches(lead, queue, subQueue = "all") {
      if (queue === "all") return true;
      if (queue === "pending") {
        if (!["p4", "p6"].includes(lead.queue)) return false;
        return subQueue === "all" || lead.queue === subQueue;
      }
      return lead.queue === queue;
    }

    function visibleRows() {
      return baseRows().filter((lead) => queueMatches(lead, state.queue, state.subQueue));
    }

    function queueCount(queue, subQueue = "all") {
      if (state.primaryTab !== "myFollowUp") return 0;
      return baseRows().filter((lead) => queueMatches(lead, queue, subQueue)).length;
    }

    function queuePriority(key) {
      return ({ p0: "P0", p1: "P1", p2: "P2", p3: "P3", pending: "P4/P6", p5: "P5" })[key] || "";
    }

    function renderQueueChip(key, title) {
      const count = key === "all" ? queueCount("all") : queueCount(key, "all");
      const priority = queuePriority(key);
      return `<button class="queue-chip ${key === "all" ? "all" : ""} ${state.queue === key ? "active" : ""}" type="button" data-queue="${key}">
        <span class="queue-name">${esc(title)}</span>
        ${priority ? `<span class="queue-priority">${priority}</span>` : ""}
        <span class="queue-count">${count}</span>
      </button>`;
    }

    function renderPrimaryTabs() {
      const tabs = [
        ["publicPool", "12,760"],
        ["myFollowUp", String(leads.length)],
        ["paidTab", "15"],
        ["callRecords", "428"]
      ];
      return `<div class="primary-tabs" role="tablist">
        ${tabs.map(([key, count]) => `<button class="primary-tab ${state.primaryTab === key ? "active" : ""}" type="button" data-primary="${key}" role="tab" aria-selected="${state.primaryTab === key}">
          ${esc(t(key))} <span class="tab-count">(${count})</span>
        </button>`).join("")}
      </div>`;
    }

    function renderQueueArea() {
      const todayCount = queueCount("p4");
      const historyCount = queueCount("p6");
      return `<div class="queue-head">
          <div class="queue-strip" role="tablist" aria-label="${esc(t("quickQueues"))}">
            ${renderQueueChip("all", t("all"))}
            ${renderQueueChip("p0", t("pendingPayment"))}
            ${renderQueueChip("p1", t("unfinishedTrial"))}
            ${renderQueueChip("p2", t("todayAppointment"))}
            ${renderQueueChip("p3", t("noShow"))}
            ${renderQueueChip("pending", t("pendingConnect"))}
            ${renderQueueChip("p5", t("connectedUnbooked"))}
          </div>
          <button class="queue-refresh" id="refresh-queues" type="button" title="${esc(t("refresh"))}" aria-label="${esc(t("refresh"))}">↻</button>
        </div>
        ${state.queue === "pending" ? `<div class="subqueue-row">
          <span class="subqueue-label">${esc(t("pendingConnect"))}</span>
          <button class="subqueue-btn ${state.subQueue === "all" ? "active" : ""}" type="button" data-subqueue="all">${esc(t("allPending"))} ${queueCount("pending", "all")}</button>
          <button class="subqueue-btn ${state.subQueue === "p4" ? "active" : ""}" type="button" data-subqueue="p4">${esc(t("todayAssigned"))} ${todayCount}</button>
          <button class="subqueue-btn ${state.subQueue === "p6" ? "active" : ""}" type="button" data-subqueue="p6">${esc(t("historyUnconnected"))} ${historyCount}</button>
        </div>` : ""}`;

    function render() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === state.lang);
      });

      const rows = state.primaryTab === "myFollowUp" ? visibleRows() : [];
      const pages = Math.max(1, Math.ceil(rows.length / state.pageSize));
      if (state.page > pages) state.page = pages;
      const pageRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
      const activeLabel = state.queue === "all" ? t("all") : queueMainLabel(state.queue);

      $("#content").innerHTML = `
        ${renderPrimaryTabs()}
        ${state.primaryTab === "myFollowUp" ? renderQueueArea() : ""}
        <section class="toolbar">
          <div class="filters">
            <label>
              <span class="field-label">${esc(t("search"))}</span>

                    ${state.queue === "all"

                </tr>`).join("")}

          input.setSelectionRange(input.value.length, input.value.length);

          render();

      state.queue = "all";

      render();

    function detailRows(lead) {
      return [
        [t("leadId"), lead.id],
        [t("businessLine"), lineLabel(lead.line)],
        [t("intent"), intentLabel(lead.intent)],
        [t("leadStatus"), t(lead.status)],
        [t("stage"), stageLabel(lead.stage)],
        [t("queueLabel"), queueMainLabel(lead.queue)],
        [t("queueReason"), lead.queue ? t(QUEUE_META[lead.queue].reason) : t("processed")],
        [t("nextAction"), lead.queue ? actionLabel(lead.queue) : t("viewUser")],
        [t("ownerName"), lead.owner],
        [t("lastAction"), lead.lastAction]
      ];
    }

    function outcomeOptions(queue) {
      const map = {
        p0: ["outcomePaid", "outcomeNotPaid"],
        p1: ["outcomeComplete"],
        p2: ["outcomeAttended", "outcomeNoShow", "outcomeReschedule"],
        p3: ["outcomeReschedule"],
        p4: ["outcomeConnected", "outcomeUnconnected"],
        p6: ["outcomeConnected", "outcomeUnconnected"],
        p5: ["outcomeBooked", "outcomeRejected"]
      };
      return (map[queue] || []).map((key) => `<option value="${key}">${esc(t(key))}</option>`).join("");
    }

        drawer.innerHTML = `
          <div class="drawer-head">
            <div><h2 id="drawer-title">${esc(t("detailTitle"))}</h2><p>${esc(lead.name)} · ${esc(lead.id)}</p></div>
            <button class="icon-btn" type="button" data-close aria-label="${esc(t("close"))}">×</button>
          </div>
          <div class="drawer-body">
            <h3>${esc(t("basicInfo"))}</h3>
            <dl class="detail-grid">
              ${detailRows(lead).map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join("")}
            </dl>
            <div class="drawer-foot">
              <button class="btn" type="button" data-close>${esc(t("close"))}</button>
              ${lead.queue ? `<button class="btn btn-primary" type="button" data-switch-process>${esc(actionLabel(lead.queue))}</button>` : ""}
            </div>
          </div>`;
      } else {
        drawer.innerHTML = `
          <div class="drawer-head">
            <div><h2 id="drawer-title">${esc(t("processTitle"))}</h2><p>${esc(lead.name)} · ${esc(queueMainLabel(lead.queue))}</p></div>
            <button class="icon-btn" type="button" data-close aria-label="${esc(t("close"))}">×</button>
          </div>
          <form class="drawer-body" id="process-form">
            <div class="detail-grid" style="margin-bottom:18px">
              <dt>${esc(t("queueReason"))}</dt><dd>${esc(t(QUEUE_META[lead.queue].reason))}</dd>
              <dt>${esc(t("nextAction"))}</dt><dd>${esc(actionLabel(lead.queue))}</dd>
            </div>
            <div class="form-grid">
              <div class="form-field">
                <label for="outcome">${esc(t("result"))}</label>
                <select class="select" id="outcome" required><option value="">${esc(t("result"))}</option>${outcomeOptions(lead.queue)}</select>
                <div class="error" id="outcome-error"></div>
              </div>
              ${["p3", "p5"].includes(lead.queue) ? `<div class="form-field"><label for="next-time">${esc(t("appointmentTime"))}</label><input class="input" id="next-time" type="datetime-local"></div>` : ""}
              <div class="form-field">
                <label for="notes">${esc(t("notes"))}</label>
                <textarea class="textarea" id="notes" maxlength="500" placeholder="${esc(t("notes"))}"></textarea>
              </div>
            </div>
            <div class="drawer-foot">
              <button class="btn" type="button" data-close>${esc(t("cancel"))}</button>
              <button class="btn btn-primary" type="submit">${esc(t("save"))}</button>
            </div>
          </form>`;
      }
      $("#overlay").classList.add("open");
      $("#overlay").setAttribute("aria-hidden", "false");
      bindDrawer(lead, mode);
    }

    function bindDrawer(lead, mode) {
      $("#drawer").querySelectorAll("[data-close]").forEach((btn) => btn.addEventListener("click", closeDrawer));
      if (mode === "detail") {
        $("#drawer [data-switch-process]")?.addEventListener("click", () => openDrawer("process", lead.id));
        return;
      }
      $("#process-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (state.processing) return;
        const outcome = $("#outcome").value;
        if (!outcome) {
          $("#outcome-error").textContent = t("required");
          return;
        }
        state.processing = true;
        applyOutcome(lead, outcome);
        closeDrawer();
        render();
        showToast(t("saveSuccess"));
      });
    }

    function applyOutcome(lead, outcome) {
      const nextQueue = {
        outcomePaid: null,
        outcomeNotPaid: "p0",
        outcomeComplete: null,
        outcomeAttended: "p0",
        outcomeNoShow: "p3",
        outcomeReschedule: "p2",
        outcomeConnected: "p5",
        outcomeUnconnected: lead.queue === "p4" ? "p6" : "p6",
        outcomeBooked: "p2",
        outcomeRejected: null
      }[outcome];
      lead.queue = nextQueue;
      lead.lastAction = new Date().toLocaleString(state.lang === "zh" ? "zh-CN" : "en-US");
      if (outcome === "outcomeAttended") {
        lead.stage = "done_unpaid";
        lead.status = "statusUnpaidTrialDone";
      } else if (outcome === "outcomeNoShow") {
        lead.stage = "absent";
      } else if (outcome === "outcomeReschedule" || outcome === "outcomeBooked") {
        lead.stage = "booked";
      } else if (outcome === "outcomeConnected") {
        lead.stage = "connected_unbooked";
      } else if (outcome === "outcomeUnconnected") {
        lead.stage = "not_connected";
      }
    }

    function closeDrawer() {
      $("#overlay").classList.remove("open");
      $("#overlay").setAttribute("aria-hidden", "true");
      state.selectedLeadId = null;
      state.processing = false;
    }

    $("#overlay").addEventListener("click", (event) => {
      if (event.target === $("#overlay")) closeDrawer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && $("#overlay").classList.contains("open")) closeDrawer();
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.lang = btn.dataset.lang;
        localStorage.setItem("crm-quick-filter-lang", state.lang);
        render();
      });
    });

    render();
  </script>
</body>
</html>
