<!doctype html>
<html lang="zh-CN">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dino CRM · 销售中心</title>

  <style>
    :root {
      --blue: #2368d8;
      --blue-strong: #195dc5;
      --blue-soft: #eaf2ff;
      --navy: #10233f;
      --ink: #1d2939;
      --muted: #667085;
      --line: #e3e9f1;
      --bg: #f3f6fa;
      --white: #fff;
      --green: #147a55;
      --green-soft: #e8f7ef;
      --amber: #9a6208;
      --amber-soft: #fff5da;
      --red: #bd3434;
      --red-soft: #fff0f0;
      --violet: #6650b1;
      --violet-soft: #f0edff;
      --shadow: 0 18px 50px rgba(25, 46, 77, .18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .sidebar {
      background: var(--navy);
      color: #dbe6f5;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #3679e5;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }
    .brand strong { display: block; color: #fff; font-size: 16px; }
    .brand span { font-size: 11px; color: #9fb2cd; }
    .nav-label { padding: 0 10px; margin-bottom: 7px; color: #8296b4; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dbe6f5;
      text-align: left;
      padding: 10px 12px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.07); }
    .nav-btn.active { background: #2d70df; color: #fff; }
    .nav-icon { width: 18px; text-align: center; }
    .sidebar-foot { margin-top: auto; padding: 12px; color: #9fb2cd; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #54d49a; display: inline-block; margin-right: 7px; }
    .workspace { min-width: 0; }
    .topbar {
      min-height: 78px;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .crumb { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .title { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .lang-switch { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .lang-btn { border: 0; background: #fff; color: var(--muted); padding: 6px 10px; }
    .lang-btn.active { background: var(--blue); color: #fff; }
    .account { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); font-weight: 800; }
    .account strong { display: block; font-size: 13px; }
    .account span { display: block; color: var(--muted); font-size: 11px; }
    .content { padding: 18px 22px 46px; }
    .toolbar, .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 3px rgba(23,43,77,.03); }
    .toolbar { padding: 14px 16px; margin-bottom: 14px; }
    .filters { display: grid; grid-template-columns: minmax(220px,1.5fr) minmax(150px,.75fr) minmax(170px,.8fr) auto; gap: 10px; align-items: end; }
    .field-label { display: block; margin-bottom: 5px; color: #475467; font-size: 12px; font-weight: 600; }
    .input, .select {
      width: 100%;
      border: 1px solid #d8e0eb;
      background: #fff;
      color: var(--ink);
      border-radius: 7px;
      padding: 8px 10px;
      min-height: 36px;
      outline: none;
    }
    textarea.input { resize: vertical; min-height: 72px; }
    .input:focus, .select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(35,104,216,.12); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      border: 1px solid transparent;
      border-radius: 7px;
      min-height: 34px;
      padding: 6px 12px;
      color: var(--ink);
      background: #fff;
      white-space: nowrap;
    }
    .btn:hover { border-color: #bac7d8; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 650; }
    .btn-primary:hover { background: var(--blue-strong); }
    .btn-soft { background: var(--blue-soft); border-color: #dbe8ff; color: var(--blue); font-weight: 650; }
    .btn-small { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .panel-head { padding: 15px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .panel-title { font-weight: 750; font-size: 15px; }
    .muted { color: var(--muted); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { background: #f8fafc; text-align: left; color: #475467; font-size: 12px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 12px; border-bottom: 1px solid #edf1f6; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .user-name { font-weight: 700; }
    .uid { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; width: fit-content; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; }
    .pill-blue { color: var(--blue); background: var(--blue-soft); }
    .pill-green { color: var(--green); background: var(--green-soft); }
    .pill-amber { color: var(--amber); background: var(--amber-soft); }
    .pill-red { color: var(--red); background: var(--red-soft); }
    .pill-violet { color: var(--violet); background: var(--violet-soft); }
    .pill-neutral { color: #475467; background: #edf1f6; }
    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
    .row-menu { position: relative; display: inline-block; }
    .menu-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 140px;
      padding: 5px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
      z-index: 20;
    }
    .menu-item { width: 100%; border: 0; background: #fff; text-align: left; border-radius: 6px; padding: 9px 10px; color: var(--ink); }
    .menu-item:hover { background: #f4f7fc; }
    .modal-layer {
      position: fixed;
      inset: 0;
      background: rgba(15,27,46,.46);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-layer.open { display: flex; }
    .modal {
      width: min(680px,100%);
      max-height: min(820px,92vh);
      overflow: auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 28px 80px rgba(4,20,43,.28);
    }
    .modal-head { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; position: sticky; top: 0; background: #fff; z-index: 3; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-tools { display: flex; align-items: center; gap: 10px; }
    .modal-tools .lang-btn { padding: 5px 8px; }
    .icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; padding: 2px 6px; }
    .modal-body { padding: 18px 19px; }
    .modal-foot { padding: 14px 19px 18px; display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .field.full { grid-column: 1 / -1; }
    .error { margin-top: 4px; color: var(--red); font-size: 12px; min-height: 16px; }
    .stage-line { display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 14px; }
    .stage-line strong { font-size: 13px; }
    .hint { padding: 10px 12px; border-radius: 9px; background: var(--blue-soft); color: #315177; margin: 0 0 14px; }
    .hint.warn { background: var(--amber-soft); color: #714b0d; }
    .history { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .history-title { font-weight: 750; margin-bottom: 11px; }
    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; padding: 0 0 15px 22px; }
    .timeline-item::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: -2px; width: 1px; background: var(--line); }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot { position: absolute; left: 1px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
    .timeline-action { font-weight: 700; }
    .timeline-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .timeline-note { margin-top: 5px; color: #3d4d61; white-space: pre-wrap; }
    .confirm-box { border: 1px solid #f1cf8d; background: var(--amber-soft); padding: 12px; border-radius: 9px; margin-top: 14px; }
    .confirm-box strong { display: block; margin-bottom: 4px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%,18px);
      background: #15273f;
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 100;
      box-shadow: var(--shadow);
      max-width: min(92vw,560px);
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .toast.error { background: #7d2525; }
    .hidden { display: none !important; }
    .detail-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 20px; }
    .detail-grid small { display: block; color: var(--muted); font-size: 11px; }
    .detail-grid strong { font-size: 13px; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 72px minmax(0,1fr); }
      .sidebar { padding: 18px 10px; }
      .brand-copy, .nav-label, .sidebar-foot, .nav-btn span:last-child { display: none; }
      .brand { justify-content: center; padding: 0; }
      .nav-btn { justify-content: center; }
    }
    @media (max-width: 700px) {
      .content { padding: 12px; }
      .topbar { padding: 12px 14px; }
      .account-copy { display: none; }
      .filters, .form-grid, .detail-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .modal-layer { padding: 10px; }
    }
  </style>
</head>

      <main class="content" id="content"></main>
    </div>

    function setLang(lang) {
      const modalValues = state.modalType === "follow" ? {
        action: $("#action-select")?.value,
        appointmentTime: $("#appointment-time")?.value,
        meetingLink: $("#meeting-link")?.value,
        reason: $("#reason-select")?.value,
        otherReason: $("#other-reason")?.value,
        note: $("#follow-note")?.value,
        confirming: state.confirming,
        source: state.followSource
      } : state.modalType === "outbound" ? {
        callResult: $("#call-result")?.value
      } : null;
      const editingId = state.editingId;
      const viewingId = state.viewingId;
      const modalType = state.modalType;
      state.lang = lang === "en" ? "en" : "zh";
      try { localStorage.setItem("crm-direct-outcome-lang", state.lang); } catch {}
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll(".lang-btn").forEach((button) => {
        const active = button.dataset.lang === state.lang;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = tr(node.dataset.i18n); });

        if (modalValues?.reason === "reasonOther" || modalValues?.reason === "closeOther") {
          $("#other-reason-field").classList.remove("hidden");
        }
        if (modalValues?.confirming) {
          state.confirming = true;
          updateSaveLabel();
        }

        openOutboundModal(editingId);

        const queryOk = !q || [lead.name, lead.id, lead.phone, lead.account].some((value) => String(value).toLowerCase().includes(q));
        return lineOk && stageOk && queryOk;
      });

                  <button class="menu-item" type="button" data-edit="${lead.id}" role="menuitem">${esc(tr("updateFollow"))}</button>
                  <button class="menu-item" type="button" data-view="${lead.id}" role="menuitem">${esc(tr("viewUser"))}</button>
                </div>
              </div>
            </td>
          </tr>`).join("")}</tbody>
      </table></div>`;
    }

    function bindTableActions() {
      document.querySelectorAll("[data-menu]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        const id = button.dataset.menu;
        state.openMenuId = state.openMenuId === id ? null : id;
        document.querySelectorAll("[data-menu-pop]").forEach((menu) => {
          const open = menu.dataset.menuPop === state.openMenuId;
          menu.classList.toggle("hidden", !open);
          const trigger = document.querySelector(`[data-menu="${menu.dataset.menuPop}"]`);
          trigger?.setAttribute("aria-expanded", String(open));
        });
      }));
      document.querySelectorAll("[data-outbound]").forEach((button) => button.addEventListener("click", () => openOutboundModal(button.dataset.outbound)));
      document.querySelectorAll("[data-edit]").forEach((button) => button.addEventListener("click", () => openFollowModal(button.dataset.edit)));
      document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => openUserModal(button.dataset.view)));
    }

    function renderUsers() {
      $("#content").innerHTML = `<section class="panel">
        <div class="panel-head">
          <div class="panel-title">${esc(tr("usersTitle"))}</div>
          <span class="muted">${esc(fmt("total", { n: leads.length }))}</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>${esc(tr("user"))}</th><th>${esc(tr("businessLine"))}</th><th>${esc(tr("userStatus"))}</th><th>${esc(tr("followStage"))}</th><th>${esc(tr("actions"))}</th></tr></thead>
          <tbody>${leads.map((lead) => `<tr>
            <td><div class="user-name">${esc(lead.name)}</div><div class="uid">${esc(lead.id)}</div></td>
            <td>${esc(lineLabel(lead.line))}</td>
            <td>${esc(tr(STATUS_I18N[lead.status]))}</td>
            <td>${stagePill(lead.stage)}</td>
            <td><button class="btn btn-small" type="button" data-view="${lead.id}">${esc(tr("viewUser"))}</button></td>
          </tr>`).join("")}</tbody>
        </table></div>
      </section>`;
      document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => openUserModal(button.dataset.view)));
    }

    function openOverlay(html) {
      document.querySelectorAll("[data-menu-pop]").forEach((menu) => menu.classList.add("hidden"));
      document.querySelectorAll("[data-menu]").forEach((button) => button.setAttribute("aria-expanded", "false"));
      state.openMenuId = null;
      $("#modal").innerHTML = html;
      $("#modal-layer").classList.add("open");
      $("#modal-layer").setAttribute("aria-hidden", "false");
      $("#modal").querySelectorAll(".lang-btn").forEach((button) => button.addEventListener("click", () => setLang(button.dataset.lang)));
      $("#modal-layer .icon-btn")?.focus();
    }

    function closeOverlay() {
      $("#modal-layer").classList.remove("open");
      $("#modal-layer").setAttribute("aria-hidden", "true");
      $("#modal").innerHTML = "";
      state.editingId = null;
      state.viewingId = null;
      state.modalType = null;
      state.followSource = "manual";
      state.initialPauseReason = "";
      state.action = "";
      state.confirming = false;
      state.saving = false;
    }

    function openUserModal(id) {
      const lead = leadById(id);
      if (!lead) return;
      state.modalType = "user";
      state.viewingId = id;
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(tr("userDetail"))}</h2><div class="modal-tools">${modalLanguageSwitch()}<button class="icon-btn" type="button" data-close aria-label="${esc(tr("close"))}">×</button></div></div>
        <div class="modal-body">
          <div class="stage-line"><strong>${esc(lead.name)}</strong>${stagePill(lead.stage)}</div>
          <div class="detail-grid">
            <div><small>${esc(tr("leadID"))}</small><strong>${esc(lead.id)}</strong></div>
            <div><small>${esc(tr("phone"))}</small><strong>${esc(lead.phone)}</strong></div>
            <div><small>${esc(tr("businessLine"))}</small><strong>${esc(lineLabel(lead.line))}</strong></div>
            <div><small>${esc(tr("loginAccount"))}</small><strong>${esc(lead.account)}</strong></div>
            <div><small>${esc(tr("intent"))}</small><strong>${esc(tr(INTENT_I18N[lead.intent]))}</strong></div>
            <div><small>${esc(tr("owner"))}</small><strong>${esc(lead.owner)}</strong></div>
          </div>
        </div>
        <div class="modal-foot"><button class="btn btn-primary" type="button" data-close>${esc(tr("close"))}</button></div>`);
      bindOverlayClose();
    }

    function openOutboundModal(id) {
      const lead = leadById(id);
      if (!lead) return;
      state.modalType = "outbound";
      state.editingId = id;
      state.viewingId = id;
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(tr("callTitle"))}</h2><div class="modal-tools">${modalLanguageSwitch()}<button class="icon-btn" type="button" data-close aria-label="${esc(tr("close"))}">×</button></div></div>
        <form id="outbound-form">
          <div class="modal-body">
            <div class="stage-line"><strong>${esc(lead.name)}</strong>${stagePill(lead.stage)}</div>
            <label class="field">
              <span class="field-label">${esc(tr("callResult"))}</span>
              <select class="select" id="call-result">
                <option value="connected">${esc(tr("connected"))}</option>
                <option value="unconnected">${esc(tr("unconnected"))}</option>
              </select>
            </label>
            <div class="hint section-gap" id="call-result-hint">${esc(tr("connectedHint"))}</div>
          </div>
          <div class="modal-foot">
            <button class="btn" type="button" data-close>${esc(tr("cancel"))}</button>
            <button class="btn btn-primary" type="submit">${esc(tr("saveCall"))}</button>
          </div>
        </form>`);
      bindOverlayClose();
      $("#call-result").addEventListener("change", () => {
        $("#call-result-hint").textContent = $("#call-result").value === "connected" ? tr("connectedHint") : tr("unreachedNotice");
      });
      $("#outbound-form").addEventListener("submit", (event) => {
        event.preventDefault();
        saveOutboundResult(lead);
      });
    }

    function saveOutboundResult(lead) {
      const result = $("#call-result").value;
      const before = lead.stage;
      const note = result === "connected" ? tr("actionOutboundConnected") : tr("actionOutboundUnreached");
      lead.lastCallResult = result;
      const canAdvanceToPendingBooking = result === "connected" && ["waiting_call","unreached","waiting_booking","paused"].includes(before);
      const canWriteUnreached = result === "unconnected" && ["waiting_call","unreached","paused"].includes(before);
      if (canAdvanceToPendingBooking) lead.stage = "waiting_booking";
      if (canWriteUnreached) lead.stage = "unreached";
      lead.history.unshift({
        action: "outbound",
        label: result === "connected" ? "actionOutboundConnected" : "actionOutboundUnreached",
        at: "2026-11-20 10:10",
        note,
        before,
        after: lead.stage
      });
      closeOverlay();
      render();
      if (result === "unconnected") {
        toast(canWriteUnreached ? tr("callUnreachedSaved") : tr("saveSuccess"));
        return;
      }
      toast(tr("callConnectedSaved"));
      openFollowModal(lead.id, { source: "outbound" });
    }

    function actionOptions(lead) {
      if (lead.stage === "rejected" || lead.stage === "closed") {
        return [{ value: "reactivate", label: tr("reactivate") }];
      }
      if (lead.stage === "paused") {
        return [
          { value: "pause", label: tr("pause") },
          { value: "create", label: tr("create") },
          { value: outcome(lead), label: tr(outcomeLabelKey(lead)) }
        ];
      }
      if (lead.stage === "booked") {
        return [
          { value: "continue", label: tr("continueFollow") },
          { value: "reschedule", label: tr("reschedule") },
          { value: "cancel", label: tr("cancelAppointment") },
          { value: "no_show", label: tr("noShow") },
          { value: "completed", label: tr("attendedComplete") },
          { value: "incomplete", label: tr("attendedIncomplete") },
          { value: "close", label: tr("closeLead") }
        ];
      }
      if (lead.stage === "payment_pending") {
        return [
          { value: "continue", label: tr("continueFollow") },
          { value: "pause", label: tr("pause") },
          { value: "close", label: tr("closeLead") }
        ];
      }
      const options = [];
      if (lead.stage !== "payment_pending") options.push({ value: "create", label: tr("create") });
      options.push({ value: "pause", label: tr("pause") });
      options.push({ value: outcome(lead), label: tr(outcomeLabelKey(lead)) });
      return options;
    }

    function openFollowModal(id, options = {}) {
      const lead = leadById(id);
      if (!lead) return;
      state.modalType = "follow";
      state.viewingId = id;
      state.editingId = id;
      state.followSource = options.source || "manual";
      state.initialPauseReason = lead.pauseReason || "";
      const actions = actionOptions(lead);
      const defaultAction = lead.stage === "paused"
        ? "pause"
        : lead.stage === "booked"
          ? "continue"
          : ["rejected","closed"].includes(lead.stage)
            ? "reactivate"
            : "";
      state.action = defaultAction;
      openOverlay(`
        <div class="modal-head"><h2 id="modal-title">${esc(tr("modalTitle"))}</h2><div class="modal-tools">${modalLanguageSwitch()}<button class="icon-btn" type="button" data-close aria-label="${esc(tr("close"))}">×</button></div></div>
        <form id="follow-form">
          <div class="modal-body">
            <div class="stage-line">
              <span class="muted">${esc(tr("currentStage"))}</span>
              ${stagePill(lead.stage)}
            </div>
            ${state.followSource === "outbound" ? `<div class="hint">${esc(tr("connectedHint"))}</div>` : ""}
            <div class="form-grid">
              <label class="field full">
                <span class="field-label">${esc(tr("nextAction"))}</span>
                <select class="select" id="action-select">
                  ${defaultAction ? "" : `<option value="">${esc(tr("selectAction"))}</option>`}
                  ${actions.map((option) => `<option value="${option.value}" ${option.value === defaultAction ? "selected" : ""}>${esc(option.label)}</option>`).join("")}
                </select>
                <div class="error" id="action-error"></div>
              </label>
              <div class="field full hidden" id="direct-hint">
                <div class="hint">${esc(tr("directHint"))}</div>
              </div>
              <label class="field hidden" id="appointment-time-field">
                <span class="field-label" id="appointment-label">${esc(tr("appointmentTime"))} · ${esc(tr("appointmentTimezone"))}</span>
                <input class="input" type="datetime-local" id="appointment-time">
                <div class="error" id="time-error"></div>
              </label>
              <label class="field hidden" id="meeting-link-field">
                <span class="field-label">${esc(tr("meetingLink"))}</span>
                <input class="input" id="meeting-link" placeholder="${esc(tr("meetingOptional"))}">
                <div class="error" id="meeting-error"></div>
              </label>
              <label class="field full hidden" id="reason-field">
                <span class="field-label">${esc(tr("reason"))}</span>
                <select class="select" id="reason-select"><option value="">${esc(tr("reasonPlaceholder"))}</option></select>
                <div class="error" id="reason-error"></div>
              </label>
              <label class="field full hidden" id="other-reason-field">
                <span class="field-label">${esc(tr("reasonOther"))}</span>
                <textarea class="input" id="other-reason" rows="2"></textarea>
                <div class="error" id="other-reason-error"></div>
              </label>
              <label class="field full">
                <span class="field-label" id="note-label">${esc(tr("note"))}</span>
                <textarea class="input" id="follow-note" rows="3" placeholder="${esc(tr("notePlaceholder"))}"></textarea>
                <div class="error" id="note-error"></div>
              </label>
            </div>
            <div id="confirmation"></div>
            <section class="history">
              <div class="history-title">${esc(tr("timeline"))}</div>
              ${renderTimeline(lead)}
            </section>
          </div>
          <div class="modal-foot">
            <button class="btn" type="button" data-close>${esc(tr("cancel"))}</button>
            <button class="btn btn-primary" type="submit" id="save-follow">${esc(tr("save"))}</button>
          </div>
        </form>`);
      bindOverlayClose();
      $("#action-select").addEventListener("change", (event) => {
        state.action = event.target.value;
        state.confirming = false;
        updateActionFields(lead);
      });
      $("#follow-form").addEventListener("submit", (event) => {
        event.preventDefault();
        submitFollow(lead);
      });
      updateActionFields(lead);
    }

    function updateActionFields(lead) {
      const action = state.action;
      const isCreate = action === "create";
      const isReschedule = action === "reschedule";
      const isPause = action === "pause";
      const isOutcome = action === "reject" || action === "close";
      const hasAppointmentFields = isCreate || isReschedule;
      const requiresReason = isPause || isOutcome || ["cancel","no_show","incomplete"].includes(action);
      $("#direct-hint").classList.toggle("hidden", !isCreate);
      $("#appointment-time-field").classList.toggle("hidden", !hasAppointmentFields);
      $("#meeting-link-field").classList.toggle("hidden", !hasAppointmentFields);
      $("#appointment-label").textContent = `${isCreate ? tr("appointmentOptional") : tr("appointmentTime")} · ${tr("appointmentTimezone")}`;
      $("#reason-field").classList.toggle("hidden", !requiresReason);
      $("#other-reason-field").classList.add("hidden");
      $("#note-label").textContent = isCreate ? tr("noteOptional") : tr("note");

      $("#action-error").textContent = "";
      $("#time-error").textContent = "";
      $("#meeting-error").textContent = "";
      $("#reason-error").textContent = "";
      $("#other-reason-error").textContent = "";
      $("#note-error").textContent = "";
      $("#confirmation").innerHTML = "";
      state.confirming = false;
      if (requiresReason) {
        const reasons = isPause
          ? PAUSE_REASONS
          : action === "reject"
            ? REJECT_REASONS
            : action === "cancel"
              ? ["reasonCustomerCancelled","reasonScheduleConflict","reasonDuplicateAppointment","reasonOther"]
              : action === "no_show"
                ? ["reasonCustomerAbsent","reasonUnableToContact","reasonMeetingIssue","reasonOther"]
                : action === "incomplete"
                  ? ["reasonMeetingIssue","reasonScheduleConflict","reasonOther"]
                  : CLOSE_REASONS;
        $("#reason-select").innerHTML = `<option value="">${esc(tr("reasonPlaceholder"))}</option>${reasons.map((key) => `<option value="${key}">${esc(tr(key))}</option>`).join("")}`;
        if (isPause && lead.stage === "paused" && lead.pauseReason) $("#reason-select").value = lead.pauseReason;
        $("#reason-select").onchange = () => {
          const other = $("#reason-select").value === "reasonOther" || $("#reason-select").value === "closeOther";
          $("#other-reason-field").classList.toggle("hidden", !other);
        };
      }
      updateSaveLabel();
    }

    function renderTimeline(lead) {
      if (!lead.history.length) return `<div class="muted">${esc(tr("emptyHistory"))}</div>`;
      return `<div class="timeline">${lead.history.map((item) => `
        <div class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-action">${esc(tr(item.label))}</div>
          <div class="timeline-meta">${esc(item.at)} · ${esc(item.before ? stageLabelFromHistory(item.before) : "")} → ${esc(stageLabelFromHistory(item.after))}</div>
          ${item.note ? `<div class="timeline-note">${esc(item.note)}</div>` : ""}
        </div>`).join("")}</div>`;
    }

    function stageLabelFromHistory(stage) {
      if (stage === "call_pending") return tr("stageWaitingCall");
      return STAGE_I18N[stage] ? tr(STAGE_I18N[stage]) : stage;
    }

    function updateSaveLabel() {
      const save = $("#save-follow");
      if (!save) return;
      save.disabled = state.saving;
      save.textContent = state.saving ? tr("saving") : state.confirming ? tr("confirmButton") : tr("save");
    }

    function validateFollow(lead, action) {
      let valid = true;
      const note = $("#follow-note").value.trim();
      if (!action) {
        $("#action-error").textContent = tr("actionRequired");
        return false;
      }
      if (action === "reschedule") {
        if (!$("#appointment-time").value) {
          $("#time-error").textContent = tr("timeRequired");
          valid = false;
        }
      }
      if (action === "create") {
        if (!$("#appointment-time").value && !note) {
          $("#time-error").textContent = tr("followupContentRequired");
          valid = false;
        }
        if ($("#meeting-link").value.trim() && !$("#appointment-time").value) {
          $("#time-error").textContent = tr("timeRequired");
          valid = false;
        }
      }
      if (action === "create" || action === "reschedule") {
        const link = $("#meeting-link").value.trim();
        if (link && !link.startsWith("https://")) {
          $("#meeting-error").textContent = tr("httpsOnly");
          valid = false;
        }
      }
      if (action === "pause" || action === "reject" || action === "close" || ["cancel","no_show","incomplete"].includes(action)) {
        const reason = $("#reason-select").value;
        if (!reason) {
          $("#reason-error").textContent = tr("reasonRequired");
          valid = false;
        }
        if ((reason === "reasonOther" || reason === "closeOther") && !$("#other-reason").value.trim()) {
          $("#other-reason-error").textContent = tr("otherReasonRequired");
          valid = false;
        }
      }
      if (action === "pause" && lead.stage === "paused") {
        const reason = $("#reason-select").value;
        if (!note && reason === state.initialPauseReason) {
          $("#note-error").textContent = tr("keepPausedRequired");
          valid = false;
        }
      } else if (!note && ["continue","completed","reschedule"].includes(action)) {
        $("#note-error").textContent = tr("noteRequired");
        valid = false;
      }
      return valid;
    }

    function submitFollow(lead) {
      if (state.saving) {
        toast(tr("duplicateBlocked"));
        return;
      }
      if (!validateFollow(lead, state.action)) return;
      if (["reject", "close", "reactivate"].includes(state.action) && !state.confirming) {
        state.confirming = true;
        const actionLabel = state.action === "reject" ? tr("reject") : state.action === "close" ? tr("closeLead") : tr("reactivate");
        const body = state.action === "reject" ? tr("confirmReject") : state.action === "close" ? tr("confirmClose") : tr("confirmReactivate");
        $("#confirmation").innerHTML = `<div class="confirm-box"><strong>${esc(fmt("confirmTitle", { action: actionLabel }))}</strong><div>${esc(body)}</div></div>`;
        updateSaveLabel();
        return;
      }
      state.saving = true;
      updateSaveLabel();
      applyAction(lead);
    }

    function applyAction(lead) {
      const action = state.action;
      const note = $("#follow-note").value.trim();
      const now = "2026-11-20 10:15";
      const before = lead.stage;
      let successKey = "saveSuccess";
      let event = null;

      if (action === "create") {
        const appointmentStart = $("#appointment-time").value;
        if (appointmentStart) {
          lead.appointment = {
            start: appointmentStart,
            link: $("#meeting-link").value.trim()
          };
          lead.stage = "booked";
          lead.appointmentHistory += 1;
        }
        event = {
          action,
          label: "actionCreate",
          at: now,
          note: note || `${tr("appointmentTime")}: ${appointmentStart.replace("T", " ")}`,
          before,
          after: lead.stage
        };
        successKey = appointmentStart ? "directCreateSuccess" : "newFollowupSuccess";
      } else if (action === "reschedule") {
        lead.appointment = {
          start: $("#appointment-time").value,
          link: $("#meeting-link").value.trim()
        };
        lead.stage = "booked";
        lead.appointmentHistory += 1;
        event = {
          action,
          label: "actionReschedule",
          at: now,
          note: note || `${tr("appointmentTime")}: ${lead.appointment.start.replace("T", " ")}`,
          before,
          after: "booked"
        };
        successKey = "saveSuccess";
      } else if (action === "reject") {
        lead.stage = "rejected";
        const selected = $("#reason-select").value;
        const detail = selected === "reasonOther" ? $("#other-reason").value.trim() : tr(selected);
        event = { action: "reject", label: "actionReject", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "rejected" };
        successKey = "rejectSuccess";
      } else if (action === "close") {
        lead.stage = "closed";
        const selected = $("#reason-select").value;
        const detail = selected === "closeOther" ? $("#other-reason").value.trim() : tr(selected);
        event = { action: "close", label: "actionClose", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "closed" };
        successKey = "closeSuccess";
      } else if (action === "cancel") {
        lead.stage = "waiting_booking";
        const selected = $("#reason-select").value;
        const detail = selected === "reasonOther" ? $("#other-reason").value.trim() : tr(selected);
        event = { action: "cancel", label: "actionCancelAppointment", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "waiting_booking" };
      } else if (action === "no_show") {
        lead.stage = "no_show";
        const selected = $("#reason-select").value;
        const detail = selected === "reasonOther" ? $("#other-reason").value.trim() : tr(selected);
        event = { action: "no_show", label: "actionNoShow", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "no_show" };
      } else if (action === "completed") {
        lead.stage = "payment_pending";
        event = { action: "completed", label: "actionAttendedComplete", at: now, note, before, after: "payment_pending" };
        successKey = "consultationCompleteSuccess";
      } else if (action === "incomplete") {
        lead.stage = "incomplete";
        const selected = $("#reason-select").value;
        const detail = selected === "reasonOther" ? $("#other-reason").value.trim() : tr(selected);
        event = { action: "incomplete", label: "actionAttendedIncomplete", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "incomplete" };
        successKey = "consultationIncompleteSuccess";
      } else if (action === "reactivate") {
        lead.stage = lead.previousStage || "waiting_call";
        event = { action: "reactivate", label: "actionReactivate", at: now, note: note || tr("reactivate"), before, after: lead.stage };
        successKey = "reactivateSuccess";
      } else if (action === "pause") {
        const selected = $("#reason-select").value;
        const detail = selected === "reasonOther" ? $("#other-reason").value.trim() : tr(selected);
        lead.pauseReason = selected;
        lead.stage = "paused";
        if (before === "paused") {
          event = { action: "keep_paused", label: "actionKeepPaused", at: now, note: note || detail, before, after: "paused" };
          successKey = "keepPausedSuccess";
        } else {
          event = { action: "pause", label: "actionPause", at: now, note: note ? `${detail}\n${note}` : detail, before, after: "paused" };
        }
      } else {
        event = { action: "continue", label: "actionContinue", at: now, note, before, after: before };
      }

      lead.history.unshift(event);
      state.saving = false;
      closeOverlay();
      render();
      toast(tr(successKey));
    }

    function bindOverlayClose() {
      document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeOverlay));
    }

    function modalLanguageSwitch() {
      return `<div class="lang-switch" aria-label="Language">
        <button class="lang-btn ${state.lang === "zh" ? "active" : ""}" type="button" data-lang="zh" aria-pressed="${state.lang === "zh"}">中</button>
        <button class="lang-btn ${state.lang === "en" ? "active" : ""}" type="button" data-lang="en" aria-pressed="${state.lang === "en"}">EN</button>
      </div>`;
    }

    let toastTimer;
    function toast(message, isError = false) {
      const node = $("#toast");
      node.textContent = message;
      node.classList.toggle("error", isError);
      node.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove("show"), 2600);
    }

    document.querySelectorAll(".nav-btn").forEach((button) => button.addEventListener("click", () => {
      state.route = button.dataset.route;
      closeOverlay();
      render();
    }));
    document.querySelectorAll(".lang-btn").forEach((button) => button.addEventListener("click", () => setLang(button.dataset.lang)));
    $("#modal-layer").addEventListener("click", (event) => { if (event.target.id === "modal-layer") closeOverlay(); });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".row-menu")) {
        document.querySelectorAll("[data-menu-pop]").forEach((menu) => menu.classList.add("hidden"));
        document.querySelectorAll("[data-menu]").forEach((button) => button.setAttribute("aria-expanded", "false"));
        state.openMenuId = null;
      }
    });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeOverlay(); });

    setLang(state.lang);
  </script>
</body>
</html>
