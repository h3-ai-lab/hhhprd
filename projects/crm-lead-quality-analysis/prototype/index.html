      salesFilters: {q:"",businessLine:"",intent:"",cc:"",stage:"",ageRange:"",courseLevel:"",landingSource:"",appSource:"",userStatus:"",consultation:"",from:"",to:"",channel:"",campaign:"",adset:"",ad:""},
      dashFilters: {businessLine:"",cc:"",from:"2026-11-09",to:"2026-11-15",channel:"",campaign:"",adset:"",ad:""}
    };
    const t = (key,vars={}) => {
      let value = TEXT[state.lang][key] ?? key;
      Object.entries(vars).forEach(([name,replacement]) => { value = String(value).replaceAll(`{${name}}`,String(replacement)); });
      return value;
    };
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const money = value => new Intl.NumberFormat("en-US").format(value);
    const pct = (num, den) => den ? (num / den * 100).toFixed(1) + "%" : "—";
    const option = (value,label,selected) => `<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(label)}</option>`;
    const label = value => {
      const map = {no_trial:t("noTrial"),trial:t("trialStatus"),paid:t("paidStatus"),formal:t("formal"),guest:t("guest"),interested:t("interested"),not_interested:t("notInterested"),unknown:t("unknownIntent"),new:t("newStage"),following:t("followingStage"),connected:t("connectedStage"),booked:t("bookedStage"),trial_stage:t("trialStage"),paid_stage:t("paidStage")};
      return map[value] || value || "—";
    };
    const adFor = lead => lead.ad || null;
    const channelValue = lead => adFor(lead)?.channel || "";
    const campaignValue = lead => adFor(lead)?.campaignName || "";
    const adsetValue = lead => adFor(lead)?.adsetName || "";
    const adValue = lead => adFor(lead)?.adName || "";

    function allOptions(kind) {
      const f = state[kind];
      let rows = LEADS.filter(lead => adFor(lead));
      if (f.channel) rows = rows.filter(lead => channelValue(lead) === f.channel);
      if (f.campaign) rows = rows.filter(lead => campaignValue(lead) === f.campaign);
      if (f.adset) rows = rows.filter(lead => adsetValue(lead) === f.adset);
      return {
        channels:[...new Set(LEADS.map(channelValue).filter(Boolean))],
        campaigns:[...new Set(rows.map(campaignValue).filter(Boolean))],
        adsets:[...new Set(rows.map(adsetValue).filter(Boolean))],
        ads:[...new Set(rows.map(adValue).filter(Boolean))]
      };
    }

    function normalizeAdFilters(kind) {
      const f = state[kind]; const o = allOptions(kind);
      if (f.channel && !o.channels.includes(f.channel)) f.channel = "";
      if (f.campaign && !allOptions(kind).campaigns.includes(f.campaign)) f.campaign = "";
      if (f.adset && !allOptions(kind).adsets.includes(f.adset)) f.adset = "";
      if (f.ad && !allOptions(kind).ads.includes(f.ad)) f.ad = "";
    }

    function adFilterHtml(kind) {
      normalizeAdFilters(kind);
      const f = state[kind], o = allOptions(kind);
      const controls = [
        ["channel",t("channel"),o.channels],["campaign",t("campaign"),o.campaigns],["adset",t("adset"),o.adsets],["ad",t("ad"),o.ads]
      ];
      return `<div class="adGroup"><p class="adGroupTitle">${t("adAttribution")}</p><div class="adGrid">${controls.map(([key,name,values]) =>
        `<div class="field"><label>${name}</label><select class="control" data-filter-kind="${kind}" data-filter-key="${key}">${option("",t("all"),f[key])}${values.map(value=>option(value,value,f[key])).join("")}</select></div>`).join("")}</div></div>`;
    }

    function matchesAd(lead,f) {
      return (!f.channel || channelValue(lead) === f.channel)
        && (!f.campaign || campaignValue(lead) === f.campaign)
        && (!f.adset || adsetValue(lead) === f.adset)
        && (!f.ad || adValue(lead) === f.ad);
    }

    function filteredUsers() {
      const f = state.userFilters, q = f.q.trim().toLowerCase();
      return LEADS.filter(lead => (!q || `${lead.userId} ${lead.name}`.toLowerCase().includes(q))
        && (!f.userType || lead.userType === f.userType)
        && (!f.registration || lead.registrationMethod === f.registration)
        && (!f.landingSource || lead.landingSource === f.landingSource)
        && (!f.appSource || lead.appSource === f.appSource)
        && (!f.businessLine || lead.line === f.businessLine)
        && (!f.userStatus || lead.userStatus === f.userStatus)
        && matchesAd(lead,f));
    }

    function filteredSales() {
      const f = state.salesFilters, q = f.q.trim().toLowerCase();
      return LEADS.filter(lead => lead.bucket === state.salesTab
        && (!q || `${lead.userId} ${lead.name}`.toLowerCase().includes(q))
        && (!f.businessLine || lead.line === f.businessLine)
        && (!f.intent || lead.intent === f.intent)
        && (!f.cc || lead.cc === f.cc)
        && (!f.stage || lead.stage === f.stage)
        && (!f.ageRange || lead.ageRange === f.ageRange)
        && (!f.courseLevel || lead.courseLevel === f.courseLevel)
        && (!f.landingSource || lead.landingSource === f.landingSource)
        && (!f.appSource || lead.appSource === f.appSource)
        && (!f.userStatus || lead.userStatus === f.userStatus)
        && (!f.consultation || String(lead.consultationBooked) === f.consultation)
        && (!f.from || lead.registered >= f.from)
        && (!f.to || lead.registered <= f.to)
        && matchesAd(lead,f));
    }

    function filteredDashboard() {
      const f = state.dashFilters;
      return LEADS.filter(lead => (!f.businessLine || lead.line === f.businessLine)
        && (!f.cc || lead.cc === f.cc)
        && (!f.from || lead.registered >= f.from)
        && (!f.to || lead.registered <= f.to)
        && matchesAd(lead,f));
    }

    function selectFilters(kind,fields) {
      const f = state[kind];
      return `<div class="filterRow">${fields.map(([key,name,values,allLabel,search]) => {
        if (search) return `<div class="field search"><label>${name}</label><input class="control" id="${kind}-q" data-filter-kind="${kind}" data-filter-key="q" value="${esc(f[key])}" placeholder="${esc(name)}"></div>`;
        if (search === "date") return `<div class="field"><label>${name}</label><input type="date" class="control" data-filter-kind="${kind}" data-filter-key="${key}" value="${esc(f[key])}"></div>`;
        return `<div class="field"><label>${name}</label><select class="control" data-filter-kind="${kind}" data-filter-key="${key}">${option("",allLabel,f[key])}${values.map(value=>Array.isArray(value)?option(value[0],value[1],f[key]):option(value,value,f[key])).join("")}</select></div>`;
      }).join("")}</div>`;
    }

    function renderUsers() {
      const rows = filteredUsers(), f = state.userFilters;
      return `<div class="pageHead"><div><h1>${t("userCenter")}</h1><p class="sub">${t("userSub")}</p></div></div>
        <section class="panel filterPanel">${selectFilters("userFilters",[
          ["q",t("searchUsers"),[],"",true],["userType",t("userType"),["formal","guest"],t("allTypes")],
          ["registration",t("registration"),[["phone",t("phone")]],t("allRegistration")],
          ["landingSource",t("landingSource"),["facebook_lead","tiktok_lead","google_lead","organic"],t("allSources")],
          ["appSource",t("appSource"),["Meta","TikTok","Google","organic"],t("allSources")],
          ["businessLine",t("businessLine"),["VN","MY","TH"],t("all")],
          ["userStatus",t("userStatus"),["no_trial","trial","paid"],t("allStatus")]
        ])}${adFilterHtml("userFilters")}
        <div class="filterRow"><div class="actionRow"><button class="button ghost" data-action="reset-users">${t("reset")}</button><button class="button primary" data-action="export-users">${t("export")}</button></div></div></section>
        <section class="panel"><div class="sectionTitle"><h2>${t("userCenter")}</h2><span class="pill">${rows.length} ${t("countUnit")}</span></div>
        ${rows.length ? userTable(rows) : emptyState()}</section>`;
    }

    function adCells(lead) {
      const ad = adFor(lead);
      return `<td>${ad ? `<span class="tag blue">${esc(ad.channel)}</span>` : `<span class="tag gray">${t("noAttribution")}</span>`}</td>
        <td>${ad ? esc(ad.campaignName) : "—"}</td><td>${ad ? esc(ad.adsetName) : "—"}</td>
        <td>${ad ? `<span class="adName">${esc(ad.adName)}</span><span class="subtext">${esc(ad.adId)}</span>` : "—"}</td>`;
    }

    function userTable(rows) {
      return `<div class="tableWrap"><table class="table"><thead><tr><th>${t("userId")}</th><th>${t("studentName")}</th><th>${t("status")}</th>
        <th>${t("userType")}</th><th>${t("age")}</th><th>${t("course")}</th><th>${t("registration")}</th><th>${t("login")}</th><th>${t("smsCode")}</th><th>${t("sourceLanding")}</th>
        <th>${t("channel")}</th><th>${t("campaign")}</th><th>${t("adset")}</th><th>${t("ad")}</th></tr></thead>
        <tbody>${rows.map(lead=>`<tr><td class="mono">${lead.userId}</td><td><strong>${esc(lead.name)}</strong></td>
        <td><span class="tag ${lead.userStatus==="paid"?"green":lead.userStatus==="trial"?"amber":"gray"}">${label(lead.userStatus)}</span></td>
        <td>${label(lead.userType)}</td><td>${lead.ageRange}</td><td>${lead.courseLevel}</td><td>${t("phone")}</td><td>${esc(lead.loginAccount)}</td><td>${lead.smsCode}</td>
        <td>${esc(lead.landingSource)}</td>${adCells(lead)}</tr>`).join("")}</tbody></table></div>`;
    }

    function renderSales() {
      const rows = filteredSales(), f = state.salesFilters;
      const tabs = [["pool",t("pool")],["mine",t("mine")],["paid",t("paid")]];
      return `<div class="pageHead"><div><h1>${t("salesCenter")}</h1><p class="sub">${t("salesSub")}</p></div></div>
        <section class="panel"><div class="tabs">${tabs.map(([key,name])=>`<button class="tab ${state.salesTab===key?"active":""}" data-sales-tab="${key}">${name} <span class="tabCount">${LEADS.filter(x=>x.bucket===key).length}</span></button>`).join("")}</div>
        <div class="filterPanel">${selectFilters("salesFilters",[
          ["q",t("searchLeads"),[],"",true],["businessLine",t("businessLine"),["VN","MY","TH"],t("all")],["intent",t("intent"),["interested","not_interested","unknown"],t("allIntent")],
          ["cc",t("cc"),["Nguyễn Anh","Mali Tan","Porn K."],t("allCc")],["stage",t("stage"),["new","following","connected","booked","trial","paid"],t("allStage")]
        ])}${selectFilters("salesFilters",[
          ["ageRange",t("age"),["6-8","3-5"],t("all")],["courseLevel",t("course"),["L1"],t("all")],
          ["landingSource",t("landingSource"),["facebook_lead","tiktok_lead","google_lead","organic"],t("allSources")],
          ["appSource",t("appSource"),["Meta","TikTok","Google","organic"],t("allSources")]
        ])}${adFilterHtml("salesFilters")}${selectFilters("salesFilters",[
          ["userStatus",t("userStatus"),["no_trial","trial","paid"],t("allStatus")],
          ["consultation",t("consultation"),[["true",t("yes")],["false",t("no")]],t("all")],
          ["from",t("dateFrom"),[],"","date"],["to",t("dateTo"),[],"","date"]
        ])}<div class="filterRow"><div class="actionRow"><button class="button ghost" data-action="reset-sales">${t("reset")}</button><button class="button primary" data-action="export-sales">${t("download")}</button></div></div></div></section>
        <section class="panel"><div class="sectionTitle"><h2>${tabs.find(x=>x[0]===state.salesTab)[1]}</h2><span class="pill">${rows.length} ${t("countUnit")}</span></div>
        ${rows.length ? salesTable(rows) : emptyState()}</section>`;
    }

    function salesTable(rows) {
      return `<div class="tableWrap"><table class="table"><thead><tr><th>${t("userId")}</th><th>${t("studentName")}</th><th>${t("intent")}</th>
        <th>${t("userStatus")}</th><th>${t("userType")}</th><th>${t("age")}</th><th>${t("course")}</th><th>${t("login")}</th><th>${t("sourceLanding")}</th>
        <th>${t("businessLine")}</th><th>${t("stage")}</th><th>${t("channel")}</th><th>${t("campaign")}</th><th>${t("adset")}</th><th>${t("ad")}</th></tr></thead>
        <tbody>${rows.map(lead=>`<tr><td class="mono">${lead.userId}</td><td><strong>${esc(lead.name)}</strong></td><td>${label(lead.intent)}</td>
        <td>${label(lead.userStatus)}</td><td>${label(lead.userType)}</td><td>${lead.ageRange}</td><td>${lead.courseLevel}</td><td>${esc(lead.loginAccount)}</td><td>${esc(lead.landingSource)}</td>
        <td>${lead.line}</td><td><span class="tag blue">${stageLabel(lead.stage)}</span></td>${adCells(lead)}</tr>`).join("")}</tbody></table></div>`;
    }

    function stageLabel(stage) {
      const map = {new:t("newStage"),following:t("followingStage"),connected:t("connectedStage"),booked:t("bookedStage"),trial:t("trialStage"),paid:t("paidStage")};
      return map[stage] || stage;
    }

    function metricCounts(rows) {
      return {leads:rows.length,outbound:rows.filter(x=>x.outbound).length,connected:rows.filter(x=>x.connected).length,booked:rows.filter(x=>x.booked).length,trial:rows.filter(x=>x.trial).length,paid:rows.filter(x=>x.paid).length};
    }

    function renderDashboard() {
      const rows = filteredDashboard(), f = state.dashFilters, m = metricCounts(rows);
      const tabs = [["overview",t("overview")],["followup",t("followup")],["payment",t("payment")]];
      const definitions = dashboardMetricSets(m);
      return `<div class="pageHead"><div><h1>${t("dashboard")}</h1><p class="sub">${t("dashboardSub")}</p></div></div>
        <section class="panel"><div class="tabs">${tabs.map(([key,name])=>`<button class="tab ${state.dashboardTab===key?"active":""}" data-dashboard-tab="${key}">${name}</button>`).join("")}</div>
        <div class="filterPanel dashboardFilters">${selectFilters("dashFilters",[
          ["businessLine",t("businessLine"),["VN","MY","TH"],t("all")],["cc",t("cc"),["Nguyễn Anh","Mali Tan","Porn K."],t("allCc")]
        ])}${adFilterHtml("dashFilters")}
        <div class="filterRow"><div class="field"><label>${t("dateFrom")}</label><input type="date" class="control" data-filter-kind="dashFilters" data-filter-key="from" value="${f.from}"></div>
        <div class="field"><label>${t("dateTo")}</label><input type="date" class="control" data-filter-kind="dashFilters" data-filter-key="to" value="${f.to}"></div>
        <div class="field"><label>${t("groupBy")}</label><select class="control" data-group-by>${[["channel",t("byChannel")],["campaign",t("byCampaign")],["adset",t("byAdset")],["ad",t("byAd")]].map(([v,l])=>option(v,l,state.groupBy)).join("")}</select></div>
        <div class="actionRow"><button class="button ghost" data-action="reset-dashboard">${t("reset")}</button></div></div></div></section>
        <div class="metrics">${definitions.map(def=>metricCard(def,m)).join("")}</div>
        <section class="panel dashboardBody"><div class="dashboardHeading"><h2>${t("qualityTable")}</h2><span class="dataTime">${t("dataTime")}</span></div>
        ${rows.length ? qualityTable(rows) : emptyState()}</section>`;
    }

    function dashboardMetricSets(m) {
      const base = [{key:"leads",value:m.leads},{key:"outbound",value:m.outbound},{key:"connected",value:m.connected},{key:"booked",value:m.booked},{key:"trial",value:m.trial},{key:"paid",value:m.paid}];
      if (state.dashboardTab === "payment") return [{key:"leads",value:m.leads},{key:"paid",value:m.paid},{key:"l2s",num:m.paid,den:m.leads}];
      if (state.dashboardTab === "followup") return [{key:"leads",value:m.leads},{key:"connected",value:m.connected},{key:"booked",value:m.booked},{key:"trial",value:m.trial},{key:"paid",value:m.paid}];
      return [...base,{key:"l2s",num:m.paid,den:m.leads}];
    }

    function metricLabel(key) {
      return {leads:t("metricLeads"),outbound:t("metricOutbound"),connected:t("metricConnected"),booked:t("metricBooked"),trial:t("metricTrial"),paid:t("metricPaid"),l2s:t("l2s")}[key] || key;
    }

    function metricCard(def,m) {
      const isRate = def.key === "l2s";
      const value = isRate ? pct(def.num,def.den) : def.value;
      const meta = isRate ? `${def.num} / ${def.den}` : def.key === "leads" ? t("countUnit") : t("peopleUnit");
      return `<article class="metric"><button class="help" data-metric="${def.key}" aria-label="${t("metricHelp")}">i</button>
        <div class="metricName">${metricLabel(def.key)}</div><div class="metricValue">${value}</div><div class="metricMeta">${meta}</div></article>`;
    }

    function qualityTable(rows) {
      const groups = groupLeads(rows,state.groupBy);
      const keys = ["leads","outbound","connected","booked","trial","paid"];
      return `<div class="tableWrap"><table class="table metricTable"><thead><tr><th>${t("currentGroup")}</th>${keys.map(key=>`<th>${metricLabel(key)} <button class="help" data-metric="${key}" style="position:relative;top:auto;right:auto;vertical-align:middle">i</button></th>`).join("")}
        <th>${t("l2s")} <button class="help" data-metric="l2s" style="position:relative;top:auto;right:auto;vertical-align:middle">i</button></th></tr></thead>
        <tbody>${groups.map(group=>{const m=metricCounts(group.rows);return `<tr><td><strong>${esc(group.label)}</strong><span class="subtext">${esc(group.id || "")}</span></td>
          <td>${m.leads}</td><td>${m.outbound}</td><td>${m.connected}</td><td>${m.booked}</td><td>${m.trial}</td><td>${m.paid}</td>
          <td class="rate">${pct(m.paid,m.leads)}<small>${m.paid} / ${m.leads}</small></td></tr>`}).join("")}</tbody></table></div>`;
    }

    function groupLeads(rows,key) {
      const map = new Map();
      rows.forEach(lead=>{
        const ad=adFor(lead);
        let label,id;
        if(key==="channel"){label=ad?.channel || t("noAttribution");id=ad?.channel || "";}
        if(key==="campaign"){label=ad?.campaignName || t("noAttribution");id=ad?.campaignId || "";}
        if(key==="adset"){label=ad?.adsetName || t("noAttribution");id=ad?.adsetId || "";}
        if(key==="ad"){label=ad?.adName || t("noAttribution");id=ad?.adId || "";}
        const mapKey=`${label}|${id}`; if(!map.has(mapKey)) map.set(mapKey,{label,id,rows:[]}); map.get(mapKey).rows.push(lead);
      });
      return [...map.values()].sort((a,b)=>a.label.localeCompare(b.label,state.lang === "zh" ? "zh-CN" : "en"));
    }

    function emptyState() {
      return `<div class="empty"><strong>${t("emptyTitle")}</strong><span>${t("emptySub")}</span><div style="margin-top:14px"><button class="button" data-action="reset-current">${t("reset")}</button></div></div>`;
    }

    function render() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.title = `Dino CRM · ${t("navLabel")}`;
      document.getElementById("navLabel").textContent=t("navLabel");
      document.querySelectorAll("[data-label]").forEach(el=>el.textContent=t(el.dataset.label));
      document.querySelectorAll("[data-lang]").forEach(btn=>btn.classList.toggle("active",btn.dataset.lang===state.lang));
      document.querySelectorAll(".navItem").forEach(btn=>btn.classList.toggle("active",btn.dataset.page===state.page));
      const mobile=document.getElementById("mobileNav");
      mobile.innerHTML=[["users",t("userCenter")],["sales",t("salesCenter")],["dashboard",t("dashboard")]].map(([key,name])=>`<button class="${state.page===key?"active":""}" data-page="${key}">${name}</button>`).join("");
      document.getElementById("crumbCurrent").textContent=t(state.page==="users"?"userCenter":state.page==="sales"?"salesCenter":"dashboard");
      document.getElementById("content").innerHTML=state.page==="users"?renderUsers():state.page==="sales"?renderSales():renderDashboard();
    }

    function setFilter(kind,key,value) {
      const f=state[kind]; f[key]=value;
      if(key==="channel"){f.campaign="";f.adset="";f.ad="";}
      if(key==="campaign"){f.adset="";f.ad="";}
      if(key==="adset"){f.ad="";}
      render();
      const id = `${kind}-${key}`; const node=document.getElementById(id);
      if(node){node.focus();if(node.tagName==="INPUT"&&node.type==="text")node.setSelectionRange(node.value.length,node.value.length);}
    }

    function resetFilters(kind) {
      if(kind==="userFilters") state.userFilters={q:"",userType:"",registration:"",landingSource:"",appSource:"",businessLine:"",userStatus:"",channel:"",campaign:"",adset:"",ad:""};
      if(kind==="salesFilters") state.salesFilters={q:"",businessLine:"",intent:"",cc:"",stage:"",ageRange:"",courseLevel:"",landingSource:"",appSource:"",userStatus:"",consultation:"",from:"",to:"",channel:"",campaign:"",adset:"",ad:""};
      if(kind==="dashFilters") state.dashFilters={businessLine:"",cc:"",from:"2026-11-09",to:"2026-11-15",channel:"",campaign:"",adset:"",ad:""};
    }

    function exportRows(kind) {
      const rows=kind==="userFilters"?filteredUsers():filteredSales();
      const header=["lead_id","user_id","name","business_line","media_source","campaign_id","campaign_name","adset_id","adset_name","ad_id","ad_name"];
      const body=rows.map(x=>[x.leadId,x.userId,x.name,x.line,x.ad?.channel||"",x.ad?.campaignId||"",x.ad?.campaignName||"",x.ad?.adsetId||"",x.ad?.adsetName||"",x.ad?.adId||"",x.ad?.adName||""]);
      const csv="\uFEFF"+[header,...body].map(row=>row.map(cell=>`"${String(cell).replaceAll('"','""')}"`).join(",")).join("\r\n");
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a");a.href=url;a.download="crm-lead-quality.csv";a.click();URL.revokeObjectURL(url);showToast(t("exportDone"));
    }

    function showToast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),1800);}

    function openMetric(key){
      const formula=t("metricDefinitions")[key] || "";
      document.getElementById("modal").innerHTML=`<div class="modalHead"><h3>${metricLabel(key)} · ${t("metricHelp")}</h3><button class="close" data-action="close-modal" aria-label="${t("close")}">×</button></div>
        <div class="modalBody"><div class="formula"><strong>${t("formula",{formula})}</strong><br>${t("sampleRange")}</div></div>`;
      document.getElementById("modalLayer").classList.add("open");document.getElementById("modalLayer").setAttribute("aria-hidden","false");
    }
    function closeModal(){document.getElementById("modalLayer").classList.remove("open");document.getElementById("modalLayer").setAttribute("aria-hidden","true");document.getElementById("modal").innerHTML="";}

    document.addEventListener("click",event=>{
      const lang=event.target.closest("[data-lang]"); if(lang){state.lang=lang.dataset.lang;localStorage.setItem("lqa-lang",state.lang);render();return;}
      const nav=event.target.closest("[data-page]"); if(nav){state.page=nav.dataset.page;render();return;}
      const salesTab=event.target.closest("[data-sales-tab]"); if(salesTab){state.salesTab=salesTab.dataset.salesTab;render();return;}
      const dashTab=event.target.closest("[data-dashboard-tab]"); if(dashTab){state.dashboardTab=dashTab.dataset.dashboardTab;render();return;}
      const metric=event.target.closest("[data-metric]"); if(metric){openMetric(metric.dataset.metric);return;}
      const action=event.target.closest("[data-action]"); if(action){
        if(action.dataset.action==="reset-users"){resetFilters("userFilters");render();showToast(t("resetDone"));}
        if(action.dataset.action==="reset-sales"){resetFilters("salesFilters");render();showToast(t("resetDone"));}
        if(action.dataset.action==="reset-dashboard"){resetFilters("dashFilters");render();showToast(t("resetDone"));}
        if(action.dataset.action==="export-users") exportRows("userFilters");
        if(action.dataset.action==="export-sales") exportRows("salesFilters");
        if(action.dataset.action==="reset-current"){resetFilters(state.page==="users"?"userFilters":state.page==="sales"?"salesFilters":"dashFilters");render();showToast(t("resetDone"));}
        if(action.dataset.action==="close-modal") closeModal();
      }
      if(event.target.id==="modalLayer") closeModal();
    });
    document.addEventListener("change",event=>{
      const el=event.target.closest("[data-filter-kind]");
      if(el){setFilter(el.dataset.filterKind,el.dataset.filterKey,el.value);return;}
      if(event.target.matches("[data-group-by]")){state.groupBy=event.target.value;render();}
    });
    document.addEventListener("input",event=>{
      const el=event.target.closest("[data-filter-kind]");
      if(el && el.tagName==="INPUT") setFilter(el.dataset.filterKind,el.dataset.filterKey,el.value);
    });
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeModal();});
    render();
  </script>
</body>
</html>
