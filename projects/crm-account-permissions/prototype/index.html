<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dino CRM 系统配置">
  <title>Dino CRM · 系统配置</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM4 15h6v5H4zM14 12h6v8h-6z"/></symbol>
    <symbol id="i-sales" viewBox="0 0 24 24"><path d="M4 19V9l8-5 8 5v10M8 19v-6h8v6M3 19h18"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m4.9 4.9 2.2 2.2M16.9 16.9l2.2 2.2M4 12H1.5M22.5 12H20M4.9 19.1l2.2-2.2M16.9 7.1l2.2-2.2M12 4V1.5M12 22.5V20"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM13 7l3.5 3.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M8 4 5 6c0 7 6 13 13 13l2-3-4-2-2 2c-2-1-4-3-5-5l2-2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">D</div>
        <div class="brand-copy"><strong>Dino CRM</strong><span>运营管理平台</span></div>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <div class="nav-label">业务中心</div>
        <button class="nav-item" data-route="dashboard"><svg><use href="#i-dashboard"></use></svg><span>管理看板</span></button>
        <button class="nav-item" data-route="sales"><svg><use href="#i-sales"></use></svg><span>销售中心</span></button>
        <div class="nav-label">管理</div>
        <button class="nav-item is-active" data-route="system"><svg><use href="#i-system"></use></svg><span>系统配置</span></button>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menu-toggle" aria-label="展开导航"><svg><use href="#i-menu"></use></svg></button>
          <div>
            <div class="crumb" id="breadcrumb">Dino CRM <span>/</span> 系统管理 <span>/</span> 系统配置</div>
            <h1 id="page-title">系统配置</h1>
          </div>
        </div>
        <div class="topbar-right">
          <span class="scope-tag"><i></i>1区及下级</span>
          <div class="account">
            <div class="avatar">L</div>
            <div><strong>林悦</strong><span>1区管理员兼销售</span></div>
          </div>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-layer" id="modal-layer" aria-hidden="true">
    <button class="modal-scrim" data-action="close-modal" aria-label="关闭"></button>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
