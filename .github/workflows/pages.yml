name: Deploy product specs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          test -f 00-crm-prd-framework.md
          test -f hhhprd-site/index.html
          test -f hhhprd-site/prd-referrals-rewards.html
          test -f hhhprd-site/prd-first-contact.html
          test -f hhhprd-site/prd-first-contact-concise.html
          test -f hhhprd-site/prd-follow-up-funnel.html
          test -f hhhprd-site/prd-crm-account-permissions.html
          test -f hhhprd-site/prd-crm-org-data-permissions.html
          test -f projects/referrals-rewards/PRD.md
          test -f projects/referrals-rewards/prototype/index.html
          test -f projects/first-contact/PRD.md
          test -f projects/first-contact/prototype/index.html
          test -f projects/first-contact-concise/PRD.md
          test -f projects/first-contact-concise/prototype/index.html
          test -f projects/follow-up-funnel/PRD.md
          test -f projects/follow-up-funnel/prototype/index.html
          test -f projects/crm-account-permissions/PRD.md
          test -f projects/crm-account-permissions/prototype/index.html
          test -f projects/crm-org-data-permissions/PRD.md
          test -f projects/crm-org-data-permissions/prototype/index.html

      - name: Assemble Pages site
        run: |
          mkdir -p public/projects/referrals-rewards/prototype public/projects/first-contact/prototype public/projects/first-contact-concise/prototype public/projects/follow-up-funnel/prototype public/projects/crm-account-permissions/prototype public/projects/crm-org-data-permissions/prototype
          cp hhhprd-site/index.html public/index.html
          cp hhhprd-site/prd-referrals-rewards.html public/prd-referrals-rewards.html
          cp hhhprd-site/prd-first-contact.html public/prd-first-contact.html
          cp hhhprd-site/prd-first-contact-concise.html public/prd-first-contact-concise.html
          cp hhhprd-site/prd-follow-up-funnel.html public/prd-follow-up-funnel.html
          cp hhhprd-site/prd-crm-account-permissions.html public/prd-crm-account-permissions.html
          cp hhhprd-site/prd-crm-org-data-permissions.html public/prd-crm-org-data-permissions.html
          cp projects/referrals-rewards/PRD.md public/projects/referrals-rewards/PRD.md
          cp projects/first-contact/PRD.md public/projects/first-contact/PRD.md
          cp projects/first-contact-concise/PRD.md public/projects/first-contact-concise/PRD.md
          cp projects/first-contact-concise/README.md public/projects/first-contact-concise/README.md
          cp projects/follow-up-funnel/PRD.md public/projects/follow-up-funnel/PRD.md
          cp projects/crm-account-permissions/PRD.md public/projects/crm-account-permissions/PRD.md
          cp projects/crm-account-permissions/README.md public/projects/crm-account-permissions/README.md
          cp projects/crm-org-data-permissions/PRD.md public/projects/crm-org-data-permissions/PRD.md
          cp projects/crm-org-data-permissions/README.md public/projects/crm-org-data-permissions/README.md
          cp -R projects/referrals-rewards/prototype/. public/projects/referrals-rewards/prototype/
          cp -R projects/first-contact/prototype/. public/projects/first-contact/prototype/
          cp -R projects/first-contact-concise/prototype/. public/projects/first-contact-concise/prototype/
          cp -R projects/follow-up-funnel/prototype/. public/projects/follow-up-funnel/prototype/
          cp -R projects/crm-account-permissions/prototype/. public/projects/crm-account-permissions/prototype/
          cp -R projects/crm-org-data-permissions/prototype/. public/projects/crm-org-data-permissions/prototype/

          sed -i 's#href="../projects/referrals-rewards/prototype/index.html"#href="projects/referrals-rewards/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/first-contact/prototype/index.html"#href="projects/first-contact/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/first-contact-concise/prototype/index.html"#href="projects/first-contact-concise/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/follow-up-funnel/prototype/index.html"#href="projects/follow-up-funnel/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/crm-account-permissions/prototype/index.html"#href="projects/crm-account-permissions/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/crm-org-data-permissions/prototype/index.html"#href="projects/crm-org-data-permissions/prototype/index.html"#' public/index.html
          sed -i 's#href="../projects/referrals-rewards/PRD.md"#href="projects/referrals-rewards/PRD.md"#' public/prd-referrals-rewards.html
          sed -i 's#href="../projects/first-contact/PRD.md"#href="projects/first-contact/PRD.md"#' public/prd-first-contact.html
          sed -i 's#href="../projects/first-contact-concise/PRD.md"#href="projects/first-contact-concise/PRD.md"#' public/prd-first-contact-concise.html
          sed -i 's#href="../projects/follow-up-funnel/prototype/index.html"#href="projects/follow-up-funnel/prototype/index.html"#' public/prd-follow-up-funnel.html
          sed -i 's#href="../projects/crm-account-permissions/PRD.md"#href="projects/crm-account-permissions/PRD.md"#' public/prd-crm-account-permissions.html
          sed -i 's#href="../projects/crm-org-data-permissions/PRD.md"#href="projects/crm-org-data-permissions/PRD.md"#' public/prd-crm-org-data-permissions.html
          sed -i 's#http://127.0.0.1:4175/projects/referrals-rewards/prototype/#projects/referrals-rewards/prototype/#g' public/prd-referrals-rewards.html
          sed -i 's#http://127.0.0.1:4175/projects/first-contact/prototype/#projects/first-contact/prototype/#g' public/prd-first-contact.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
