name: Deploy product specs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          test -f shared/workflows/prd-2.0.md
          test -f shared/workflows/document-change.md
          test -f shared/skills/crm-prd-authoring/SKILL.md
          test -f shared/skills/crm-prototype-authoring/SKILL.md
          test -f shared/skills/crm-artifact-validation/scripts/validate.py
          test -f shared/rag/sources.yaml
          test -f shared/memory/README.md
          test -f hhhprd-site/index.html
          test -f hhhprd-site/prd-referrals-rewards.html
          test -f hhhprd-site/prd-first-contact.html
          test -f hhhprd-site/prd-first-contact-concise.html
          test -f hhhprd-site/prd-follow-up-funnel.html
          test -f hhhprd-site/prd-crm-org-data-permissions.html
          for project in projects/*/; do
            test -f "$project/project.yaml"
            test -f "$project/workflow/overrides.md"
            test -f "$project/skills/README.md"
            test -f "$project/rag/sources.yaml"
            test -f "$project/memory/project-memory.md"
            test -f "$project/prd/PRD.md"
            test -f "$project/prototype/index.html"
          done
          python3 shared/skills/crm-artifact-validation/scripts/validate.py

      - name: Assemble Pages site
        run: |
          mkdir -p public/projects
          cp hhhprd-site/index.html public/index.html
          cp hhhprd-site/prd-referrals-rewards.html public/prd-referrals-rewards.html
          cp hhhprd-site/prd-first-contact.html public/prd-first-contact.html
          cp hhhprd-site/prd-first-contact-concise.html public/prd-first-contact-concise.html
          cp hhhprd-site/prd-follow-up-funnel.html public/prd-follow-up-funnel.html
          cp hhhprd-site/prd-crm-org-data-permissions.html public/prd-crm-org-data-permissions.html
          cp -R projects/. public/projects/
          for project in projects/*/; do
            slug="$(basename "$project")"
            cp "$project/prd/PRD.md" "public/projects/$slug/PRD.md"
          done

          sed -i 's#href="../projects/#href="projects/#g' public/index.html
          for page in public/prd-*.html; do
            sed -i 's#href="../projects/#href="projects/#g' "$page"
            sed -i 's#http://127.0.0.1:4175/##g' "$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
